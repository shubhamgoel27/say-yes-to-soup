    <link

      type="image/svg+xml"

    <!-- Not render-blocking: on a network that stalls Google's servers the
         blocking stylesheet held back first paint, the loader included. The
         page draws at once in the fallback serifs and swaps when it lands. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&family=Caveat:wght@500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <style>
      /*
       * The UI conceit: every surface you read is a page of Nani's journal.
       * Fraunces for what is printed, Literata for what is read, Caveat for
       * what a hand wrote (hers, Pilar's, yours). Ink is never pure black;
       * shadows are tinted with the same dusk as the world.
       */
      :root {
        color-scheme: dark;
        --ink: #2b2118;
        --ink-soft: #57452f;
        --paper: #f4ead6;
        --paper-dark: #e6d7bb;
        --gold: #c8a55b;
        --terracotta: #c1512f;
        --thread: repeating-linear-gradient(
          90deg,
          #c1512f 0 10px, #d9a441 10px 20px, #3f7fb0 20px 30px, #6b8e4e 30px 40px
        );
        --display: 'Fraunces', Georgia, serif;
        --hand: 'Caveat', 'Segoe Script', cursive;
        --shadow-card: 0 2px 3px rgba(31, 22, 12, 0.28), 0 10px 28px rgba(31, 22, 12, 0.34),
          0 24px 70px rgba(20, 14, 8, 0.4);
        /* The small-print tier. Named for their normal size; the Large text
         * setting (body.text-large) floors them near 14px and scales the
         * reading sizes about 1.15x, so nothing on the page stays squint-small. */
        --fs-11: 11px;
        --fs-115: 11.5px;
        --fs-12: 12px;
        --fs-125: 12.5px;
        --fs-13: 13px;
        --fs-135: 13.5px;
        --fs-14: 14px;
        --fs-145: 14.5px;
        --fs-15: 15px;
        --fs-body: 16.5px;
        --fs-hand16: 16px;
        --fs-hand17: 17px;
        --fs-hand175: 17.5px;
        /* The small caps that name a hand (NANI, 1974 / YOU / NOW). */
        --fs-label: 10.5px;
      }
      body.text-large {
        --fs-11: 14px;
        --fs-115: 14px;
        --fs-12: 14px;
        --fs-125: 14px;
        --fs-13: 14.5px;
        --fs-135: 15px;
        --fs-14: 16px;
        --fs-145: 16.5px;
        --fs-15: 17px;
        --fs-body: 19px;
        --fs-hand16: 18.5px;
        --fs-hand17: 19.5px;
        --fs-hand175: 20px;
        --fs-label: 13px;
      }

      /* The kitchen before the journey: painted from this file alone, so it is
       * up while the game's script is still on the road. main.ts lifts it on
       * the first real frame. */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 0 16px;
        background: radial-gradient(ellipse at 50% 42%, #2a1e15 0%, #1d1510 55%, #17120e 100%);
        color: #e8dcc4;
        transition: opacity 0.6s ease;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      .ld-bowl { width: 112px; height: auto; overflow: visible; }
      .ld-steam {
        fill: none;
        stroke: #e8dcc4;
        stroke-width: 3;
        stroke-linecap: round;
        transform-box: fill-box;
        transform-origin: 50% 100%;
        opacity: 0;
        animation: ldSteam 3.2s ease-in-out infinite;
      }
      .ld-steam.s2 { animation-delay: 1.05s; }
      .ld-steam.s3 { animation-delay: 2.1s; }
      @keyframes ldSteam {
        0% { opacity: 0; transform: translateY(10px) scaleY(0.7); }
        30% { opacity: 0.55; }
        100% { opacity: 0; transform: translateY(-12px) scaleY(1.1); }
      }
      /* Her woven band, spooling out as the thread of the wait. */
      .ld-band {
        width: min(200px, 60vw);
        height: 7px;
        border-radius: 4px;
        background: rgba(232, 220, 196, 0.08);
        box-shadow: inset 0 0 0 1px rgba(232, 220, 196, 0.12);
        overflow: hidden;
      }
      .ld-band i {
        display: block;
        height: 100%;
        width: 0;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 12px, #d9a441 12px 24px, #3f7fb0 24px 36px, #6b8e4e 36px 48px
        );
        animation: ldSpool 9s cubic-bezier(0.15, 0.7, 0.3, 1) forwards, ldWeave 1.6s linear infinite;
      }
      @keyframes ldSpool { to { width: 92%; } }
      @keyframes ldWeave { to { background-position: 48px 0; } }
      .ld-lines {
        position: relative;
        width: 100%;
        height: 32px;
        font-family: 'Caveat', 'Segoe Script', cursive;
        font-size: 24px;
        text-align: center;
      }
      .ld-lines span {
        position: absolute;
        inset: 0;
        opacity: 0;
        animation: ldLine 12s ease-in-out infinite;
      }
      .ld-lines span:nth-child(2) { animation-delay: 3s; }
      .ld-lines span:nth-child(3) { animation-delay: 6s; }
      .ld-lines span:nth-child(4) { animation-delay: 9s; }
      @keyframes ldLine {
        0% { opacity: 0; transform: translateY(4px); }
        5%, 21% { opacity: 1; transform: none; }
        26%, 100% { opacity: 0; transform: translateY(-4px); }
      }
      .ld-slow {
        margin: 6px 0 0;
        max-width: 30em;
        font-family: 'Literata', Georgia, serif;
        font-size: 13px;
        line-height: 1.5;
        text-align: center;
        color: #a8977c;
        opacity: 0;
        animation: ldSlow 0.8s ease 20s forwards;
      }
      @keyframes ldSlow { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .ld-steam { animation: none; opacity: 0.4; }
        .ld-band i { animation: none; width: 100%; }
        .ld-lines span { animation: none; }
        .ld-lines span:last-child { opacity: 1; }
        .ld-slow { animation-duration: 0.01s; }
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #17120e;
        overflow: hidden;
        font-family: 'Literata', Georgia, 'Times New Roman', serif;
        /* Phones inflate text they judge too small; the journal sets its own
         * sizes deliberately. No effect on desktop browsers. */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* No rubber-banding, no pull-to-refresh escaping the game. The page
         * never scrolls (overflow: hidden above), so desktop feels nothing. */
        overscroll-behavior: none;
      }
      ::selection { background: rgba(200, 165, 91, 0.4); color: #1c1410; }
      #stage {
        position: fixed;
        inset: 0;
      }
      #frame {
        position: relative;
        width: 100vw;
        height: 100vh;
        /* Mobile browsers shrink the visible viewport under their URL bar;
         * dvh tracks it. On desktop 100dvh === 100vh, so nothing changes. */
        height: 100dvh;
        line-height: 0;
        overflow: hidden;
      }
      /* The Canvas2D world buffer is offscreen; PixiJS presents fullscreen. */
      #game { display: none; }
      #stagegl { display: block; }
      /* Everything layered over the canvas lives here. */
      #hud {
        position: absolute;
        inset: 0;
        line-height: 1.45;
        pointer-events: none;
      }

      /* ---- village nameplate ---- */
      #plate {
        position: absolute;
        top: 7%;
        left: 50%;
        transform: translate(-50%, 6px);
        padding: 8px 24px 7px 28px;
        color: #f2e6d0;
        background: rgba(23, 18, 14, 0.78);
        border: 1px solid rgba(200, 165, 91, 0.35);
        border-radius: 2px;
        font-family: var(--display);
        font-size: 14px;
        /* Letterpress settle: the name fades in slightly loose, then the
         * tracking presses tight as if the type were seated in the chase. */
        letter-spacing: 0.42em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 1.1s ease, transform 1.1s ease, letter-spacing 1.1s ease;
      }
      #plate::before, #plate::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 14px;
        height: 1px;
        background: rgba(200, 165, 91, 0.55);
      }
      #plate::before { left: 8px; }
      #plate::after { right: 8px; }
      #plate.show {
        opacity: 1;
        transform: translate(-50%, 0);
        letter-spacing: 0.34em;
        transition: opacity 1.1s ease, transform 1.1s ease, letter-spacing 0.3s ease-out 0.25s;
      }

      /* Over the face of someone near the player, an overlay goes faint
       * (faceClearHud in main.ts) and comes back once the face moves on. */
      #errand.over-face, #plate.show.over-face, #toasts.over-face { opacity: 0.16; }
      /* The place's name gets its own moment: while the nameplate is up the
       * chip waits, then comes back. Two dark cards at the top of a new
       * place competed, and the name read as the fainter one. */
      #hud #plate.show ~ #errand { opacity: 0; transition: opacity 0.3s ease; }

      /* ---- toasts: "a page filled" whispers ---- */
      /* Overlays that carry the story mute the ambient HUD around them. */
      body.quiet-hud #toasts, body.quiet-hud #errand, body.quiet-hud #plate {
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      /* A reply to a key just pressed (sound on/off) shows through the hush. */
      body.quiet-hud #toasts.through { opacity: 1; }
      #toasts {
        position: absolute;
        top: 16px;
        right: 16px;
        /* A long whisper wraps on its own side of the page: the chip owns the
         * top-left corner (up to min(42%, 440px)) and the nameplate the middle,
         * and a one-line toast used to slide straight over both. */
        max-width: min(40%, 520px);
        transition: opacity 0.25s ease;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
      }
      .toast {
        padding: 6px 12px;
        background: rgba(244, 234, 214, 0.94);
        color: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 2px;
        box-shadow: 2px 2px 0 rgba(43, 33, 24, 0.45);
        font-size: var(--fs-135);
        font-style: italic;
        opacity: 0;
        transform: translateX(10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .toast.in { opacity: 1; transform: translateX(0); }
      .toast-glyph { font-style: normal; margin: 0 0.18em; }
      /* Journal whispers (a page fills, a margin note wakes) arrive with more
       * ceremony than plain toasts: an ink dot blooms beside the words and the
       * slip settles like a page laid down, not a chip sliding in. */
      .toast.jt {
        position: relative;
        padding-left: 24px;
        border-left: 3px solid var(--terracotta);
      }
      .toast.jt::before {
        content: '';
        position: absolute;
        left: 8px;
        top: 50%;
        width: 7px;
        height: 7px;
        margin-top: -3.5px;
        border-radius: 50% 46% 52% 48%;
        background: #7a3b22;
        transform: scale(0);
      }
      .toast.jt.in { animation: toastCurl 0.32s ease-out; }
      .toast.jt.in::before { animation: inkBloom 0.38s ease-out 0.1s both; }
      @keyframes toastCurl {
        from { transform: translateX(12px) rotate(1.6deg); }
        60% { transform: translateX(-1px) rotate(-0.4deg); }
        to { transform: translateX(0) rotate(0deg); }
      }
      @keyframes inkBloom {
        0% { transform: scale(0); opacity: 0; }
        55% { transform: scale(1.45); opacity: 0.85; }
        100% { transform: scale(1); opacity: 1; }
      }
      /* Nani's whisper: the thread's once-per-chapter line, in her hand.
       * Same paper and slide as every toast (nothing new for reduced motion
       * to mind), tinted the thread's own red and set in the margin script. */
      /* It never runs past the frame's edge (it once did, over the ship's red
       * containers): sized inside the toast column, padding included, and it
       * settles from above rather than sliding in from the edge. Fully opaque
       * paper, so a busy deck behind it cannot eat the words. */
      .toast.wh {
        box-sizing: border-box;
        max-width: min(100%, 380px);
        background: #f4ead6;
        font-family: var(--hand);
        font-style: normal;
        font-size: var(--fs-hand175);
        line-height: 1.25;
        color: #7c2f18;
        border-left: 3px solid var(--terracotta);
        transform: translateY(-6px) rotate(-0.6deg);
      }
      .toast.wh.in { transform: translateY(0) rotate(-0.6deg); }

      /* ---- errand chip ---- */
      #errand {
        position: absolute;
        top: 16px;
        left: 16px;
        max-width: min(42%, 440px);
        padding: 6px 12px;
        background: rgba(23, 18, 14, 0.82);
        color: #e8dcc4;
        border: 1px solid rgba(200, 165, 91, 0.4);
        border-radius: 3px;
        font-size: var(--fs-125);
        font-style: italic;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        transition: opacity 0.25s ease;
      }
      #errand[hidden] { display: none; }
      /* Leaning on a wall asks the game a question; the chip answers by
       * glowing once, not by repeating itself in a toast. */
      #errand.call { animation: chip-call 1.6s ease-out 1; }
      @keyframes chip-call {
        0% { box-shadow: 0 0 0 0 rgba(217, 164, 65, 0); border-color: rgba(200, 165, 91, 0.4); }
        25% { box-shadow: 0 0 14px 2px rgba(217, 164, 65, 0.55); border-color: rgba(217, 164, 65, 0.95); }
        100% { box-shadow: 0 0 0 0 rgba(217, 164, 65, 0); border-color: rgba(200, 165, 91, 0.4); }
      }
      @media (prefers-reduced-motion: reduce) { #errand.call { animation: none; border-color: rgba(217, 164, 65, 0.95); } }
      #errand::before { content: '\2709\00a0\00a0'; font-style: normal; }
      /* The band's one-time reminder: a quieter last line on the chip until
       * the first manual N, then gone for the rest of the journey. */
      #errand.nudged { -webkit-line-clamp: 4; }
      .errand-nudge {
        display: block;
        margin-top: 3px;
        font-size: 0.85em;
        font-style: normal;
        letter-spacing: 0.04em;
        opacity: 0.6;
      }
      .errand-nudge::before { content: '\00B7\00a0'; color: var(--terracotta); opacity: 0.9; }
      /* On narrow windows the chip's corner ran into the centered nameplate
       * and the journey card's stamp. Below ~1100px it steps down out of the
       * plate's band and narrows, so the top-left stays one column. */
      @media (max-width: 1100px) {
        #errand {
          top: calc(7% + 52px);
          max-width: min(44vw, 330px);
        }
      }

      /* ---- dialogue box ---- */
      /* It arrives rather than appearing. Kept short: this happens hundreds
       * of times an hour and anything slower would start to cost patience. */
      #textbox.tb-in { animation: tbIn 0.13s ease-out; }
      @keyframes tbIn {
        from { transform: translateX(-50%) translateY(9px); opacity: 0; }
        to { transform: translateX(-50%) translateY(0); opacity: 1; }
      }
      #textbox {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: min(92vw, 860px);
        bottom: 18px;
        display: flex;
        gap: 12px;
        padding: 12px 14px 10px;
        background:
          linear-gradient(rgba(244, 234, 214, 0.97), rgba(236, 223, 197, 0.97));
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: 0 2px 3px rgba(31, 22, 12, 0.3), 0 10px 26px rgba(31, 22, 12, 0.35);
        color: var(--ink);
      }
      /* Woven trim along the top, from the locked palette. */
      #textbox::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        right: 2px;
        height: 4px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 8px, #c8a55b 8px 14px, #5f9fc4 14px 20px, #c8a55b 20px 26px
        );
        opacity: 0.85;
      }
      /* The portrait is a snapshot, taped into the page at a slight angle. */
      #tb-portrait {
        flex: 0 0 auto;
        align-self: flex-start;
        position: relative;
        margin-top: 8px;
        padding: 4px 4px 8px;
        background: #fbf6ea;
        border-radius: 1px;
        transform: rotate(-2deg);
        box-shadow: 0 1px 2px rgba(31, 22, 12, 0.3), 0 4px 10px rgba(31, 22, 12, 0.25);
      }
      #tb-portrait::before {
        content: '';
        position: absolute;
        top: -7px; left: 50%;
        width: 34px; height: 12px;
        transform: translateX(-50%) rotate(1.5deg);
        background: rgba(222, 205, 165, 0.7);
        box-shadow: 0 1px 2px rgba(31, 22, 12, 0.15);
      }
      #tb-portrait canvas {
        display: block;
        width: 60px;
        height: 60px;
        image-rendering: pixelated;
        box-shadow: none;
        border-radius: 0;
      }
      /* When a new speaker takes the line the snapshot settles into the tape:
       * a 2px drop, a touch of over-rotation, then still. Lines spoken with an
       * exclamation mark give the print a small hop instead. */
      #tb-portrait.settle { animation: portraitSettle 0.22s ease-out; }
      @keyframes portraitSettle {
        from { transform: rotate(-2.8deg) translateY(-2px); }
        65% { transform: rotate(-1.6deg) translateY(0.5px); }
        to { transform: rotate(-2deg) translateY(0); }
      }
      #tb-portrait.hop { animation: portraitHop 0.26s ease-out; }
      @keyframes portraitHop {
        0% { transform: rotate(-2deg) translateY(0); }
        38% { transform: rotate(-1.1deg) translateY(-3px); }
        72% { transform: rotate(-2.3deg) translateY(0.6px); }
        100% { transform: rotate(-2deg) translateY(0); }
      }
      #tb-main { position: relative; flex: 1; min-width: 0; padding-top: 4px; }
      #tb-name[hidden], #tb-portrait[hidden] { display: none; }
      /* The speaker's name: a small ink chip, hand-cut, pressed into sepia. */
      #tb-name {
        display: inline-block;
        margin-bottom: 4px;
        padding: 1.5px 10px 2.5px;
        border: 1px solid rgba(87, 69, 47, 0.35);
        color: #57452f;
        border-radius: 9px 11px 10px 8px / 10px 8px 11px 9px;
        font-family: var(--display);
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        transform: rotate(-0.6deg);
        background: rgba(87, 69, 47, 0.13);
        box-shadow: inset 0 1px 0 rgba(255, 252, 244, 0.4);
      }
      #tb-text {
        font-size: var(--fs-body);
        min-height: 48px; /* two lines: the box breathes but never yawns */
      }
      #tb-text.narrator { font-style: italic; color: #4c3d2e; }
      /* The continue cue: a quill resting its ink on the page, breathing. */
      #tb-arrow {
        position: absolute;
        right: 4px;
        bottom: 4px;
        font-size: 0; /* the old glyph retires; the dot below speaks */
      }
      #tb-arrow::after {
        content: '';
        display: block;
        width: 7px;
        height: 7px;
        border-radius: 50% 50% 50% 44%;
        background: #7a3b22;
        animation: quillDot 1.5s ease-in-out infinite;
      }
      @keyframes quillDot {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 0.85; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #tb-arrow::after { animation: none; opacity: 0.7; }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(3px); }
      }
      #tb-choices {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 4px;
      }
      /* Choices hang like a list in a margin; a manicule points at yours. */
      .tb-choice {
        padding: 1px 8px 1px 26px;
        text-indent: -8px;
        font-size: var(--fs-15);
        position: relative;
      }
      .tb-choice.sel {
        background: rgba(43, 33, 24, 0.07);
        border-radius: 2px;
      }
      .tb-choice.sel::before {
        content: '\261E';
        position: absolute;
        left: 5px;
        text-indent: 0;
        color: var(--terracotta);
      }
      /* Choices arrive one after another, 30ms apart (delay set inline), and
       * the picked one presses into the paper before the story moves on. */
      .tb-choice.in { animation: choiceIn 0.18s ease-out backwards; }
      @keyframes choiceIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .tb-choice.pick { animation: choicePick 0.12s ease-in-out; }
      @keyframes choicePick {
        50% { transform: scale(0.975); background: rgba(43, 33, 24, 0.14); }
      }
      .tb-choice:hover, .tb-choice.sel {
        text-decoration: underline;
        text-decoration-color: rgba(193, 81, 47, 0.55);
        text-decoration-thickness: 1.5px;
        text-underline-offset: 3px;
      }

      /* ---- journal overlay ---- */
      #journal {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.55);
      }
      .j-book {
        width: 82%;
        max-width: 620px;
        height: 78%;
        /* A grid item's implicit min-height: auto lets tall content push the
         * book past the viewport, taking the end of the Route tab with it. */
        min-height: 0;
        max-height: 92vh;
        max-height: 92dvh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(rgba(244, 234, 214, 0.78), rgba(244, 234, 214, 0.78)),
          url('assets/textures/paper-aged-cream.jpg') repeat,
          linear-gradient(120deg, var(--paper), var(--paper-dark));
        background-blend-mode: normal, multiply, normal;
        background-size: auto, 480px, auto;
        border: 2px solid var(--ink);
        border-radius: 4px;
        box-shadow: var(--shadow-card);
        color: var(--ink);
        padding: 14px 18px 10px;
        line-height: 1.45;
      }
      .j-book.opening { animation: bookOpen 0.22s ease-out; }
      @keyframes bookOpen {
        from { transform: translateY(10px) scale(0.96); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .j-book, .letter-paper, .w-panel, #textbox.tb-in { animation: none !important; }
      }
      .j-head { display: flex; justify-content: space-between; align-items: baseline; }
      .j-name { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: 0.01em; }
      .j-progress { font-size: var(--fs-125); font-style: italic; color: #5d4b35; font-variant-numeric: tabular-nums; }
      /* Physical index tabs, cut into the page edge like a real notebook. */
      .j-head { gap: 10px; }
      .j-progress { margin-left: auto; }
      /* The book's own close: only a finger needs it (J closes on a desk). */
      .j-close { display: none; }
      /* Every finger gets it, tablets included: the open book dims the pad's
       * ✎ under its veil, and an iPad's footer named a close it could not see. */
      @media (pointer: coarse) {
        .j-close {
          display: grid;
          place-items: center;
          flex: 0 0 auto;
          width: 40px;
          height: 40px;
          margin: -6px -4px -6px 0;
          border: 1.5px solid rgba(43, 33, 24, 0.35);
          border-radius: 50%;
          background: rgba(43, 33, 24, 0.07);
          color: var(--ink);
          font-size: 18px;
          line-height: 1;
          padding: 0;
          align-self: center;
        }
      }
      .j-tabrow { position: relative; }
      .j-tabs {
        position: relative;
        display: flex;
        gap: 3px;
        margin: 10px -6px 12px;
        border-bottom: 1.5px solid rgba(43, 33, 24, 0.4);
      }
      .j-tab {
        padding: 4px 12px 3px;
        font-size: var(--fs-13);
        /* Darker than the paper tier: the tab's own tinted gradient eats a
         * quarter of the contrast, so the ink starts deeper to stay >= 4.5:1. */
        color: #5f4c31;
        background: linear-gradient(180deg, rgba(43, 33, 24, 0.06), rgba(43, 33, 24, 0.12));
        border: 1.5px solid rgba(43, 33, 24, 0.3);
        border-bottom: none;
        border-radius: 7px 7px 0 0;
        transform: translateY(1.5px);
      }
      .j-tab.on {
        color: var(--ink);
        background: var(--paper);
        border-color: rgba(43, 33, 24, 0.4);
        font-weight: 600;
        transform: translateY(1.5px) scale(1.04);
      }
      .j-body { display: flex; gap: 16px; flex: 1; min-height: 0; }
      .j-list { flex: 0 0 38%; overflow-y: auto; min-height: 0; font-size: var(--fs-145); }
      .j-item { padding: 2px 6px; color: #57452f; }
      .j-item.sel {
        background: rgba(43, 33, 24, 0.09);
        border-radius: 2px;
        color: var(--ink);
      }
      /* A page you have not looked at since it filled: a warm sweep runs
       * across its row once, like a finger finding the new entry. */
      .j-item.j-new {
        background-image: linear-gradient(
          100deg,
          transparent 18%, rgba(200, 165, 91, 0.42) 50%, transparent 82%
        );
        background-size: 220% 100%;
        background-repeat: no-repeat;
        animation: jSweep 0.4s ease-out 0.12s both;
      }
      @keyframes jSweep {
        from { background-position: 130% 0; }
        to { background-position: -130% 0; }
      }
      .j-locked { margin-top: 8px; font-size: var(--fs-125); font-style: italic; color: #6f5c40; }
      .j-detail { flex: 1; min-width: 0; min-height: 0; overflow-x: hidden; overflow-y: auto; border-left: 1px solid rgba(43,33,24,0.25); padding-left: 16px; }
      .j-title { font-family: var(--display); font-weight: 600; font-size: 19px; text-wrap: balance; }
      .j-sub { font-size: var(--fs-13); font-style: italic; color: #5d4b35; margin-bottom: 8px; }
      .j-nani, .j-you { font-size: var(--fs-14); margin-top: 8px; }
      .j-nani {
        font-family: var(--hand);
        font-size: var(--fs-hand175);
        line-height: 1.3;
        color: #6b5334;
        transform: rotate(-0.4deg);
      }
      .j-nani.empty { opacity: 0.55; }
      .j-nani span, .j-you span {
        display: block;
        font-family: 'Literata', Georgia, serif;
        font-size: var(--fs-label);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #6b5334;
        font-style: normal;
        transform: none;
      }
      /* Every entry separates her hand from yours the same way. */
      .j-nani { border-top: 1px dashed rgba(43, 33, 24, 0.18); padding-top: 8px; }
      .j-nani.empty { border-top: 1px dashed rgba(43, 33, 24, 0.12); }
      .j-empty { font-style: italic; color: #6f5c40; margin-top: 20px; font-size: var(--fs-145); }
      .j-stitch { color: #c1512f; font-size: var(--fs-12); }
      .j-thread { font-family: var(--hand); font-size: var(--fs-hand17); line-height: 1.3; margin-top: 10px; color: #6a4c2e; transform: rotate(-0.5deg); }
      .j-thread span {
        display: block;
        font-family: 'Literata', Georgia, serif;
        font-size: var(--fs-label);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #6b5334;
        font-style: normal;
      }
      .j-thread-rule {
        height: 3px;
        margin: 10px 0 8px;
        border-radius: 2px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 10px, #d9a441 10px 20px, #3f7fb0 20px 30px, #6b8e4e 30px 40px
        );
        opacity: 0.75;
      }
      /* The first time a freshly stitched rhyme is shown, the woven thread
       * pulls through the page left to right instead of simply being there. */
      .j-thread-rule.draw {
        transform-origin: left center;
        animation: threadPull 0.38s ease-out both;
      }
      @keyframes threadPull {
        from { transform: scaleX(0); opacity: 0.3; }
        to { transform: scaleX(1); opacity: 0.75; }
      }
      .j-thread-to { font-size: var(--fs-12); font-style: normal; color: #a3542f; margin-top: 6px; }
      .j-native { font-size: var(--fs-15); color: #6a4c2e; margin-left: 8px; font-weight: normal; }
      /* The dish takes the page's width (it used to sit small at the left of
       * an empty half page), painted at three times the size so it stays
       * crisp there. */
      .j-dishart { margin: 6px 0 8px; }
      .j-dishart canvas { display: block; width: min(100%, 300px); height: auto; margin: 0 auto; border-radius: 4px; }
      /* The place a run of pages was written in: a chapter divider in her
       * book's own small capitals, with a pencil rule. */
      .j-place {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 10px 6px 3px;
        font-family: var(--display);
        font-size: var(--fs-115);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7a5f3c;
      }
      .j-place:first-child { margin-top: 0; }
      .j-place::after { content: ''; flex: 1; border-top: 1px dashed rgba(107, 83, 52, 0.45); }
      .j-route { flex: 1; overflow-y: auto; padding-right: 8px; }
      .j-route-stop { padding: 4px 2px; opacity: 0.55; }
      .j-route-stop.been { opacity: 0.85; }
      .j-route-stop.here { opacity: 1; }
      .j-route-head { display: flex; align-items: baseline; gap: 8px; }
      .j-route-glyph { width: 16px; text-align: center; color: #c1512f; }
      .j-route-name { font-size: 15.5px; }
      .j-route-stop.here .j-route-name { color: var(--ink); font-weight: 600; }
      .j-route-hop { font-size: var(--fs-12); font-style: italic; color: #6b5334; }
      .j-route-nani { font-family: var(--hand); font-size: var(--fs-hand16); color: #6b5334; margin: 0 0 2px 24px; }
      .j-route-nani.empty { opacity: 0.6; }
      .j-route-stitch {
        width: 2px; height: 8px; margin-left: 9px;
        background: repeating-linear-gradient(180deg, #b59a72 0 3px, transparent 3px 6px);
      }
      .j-tasks { flex: 1; overflow-y: auto; padding-right: 6px; }
      .j-task {
        font-size: var(--fs-14);
        line-height: 1.5;
        padding: 8px 10px 8px 26px;
        margin-bottom: 8px;
        position: relative;
        border-radius: 3px;
        color: #57452f;
      }
      .j-task::before {
        content: '\25E6';
        position: absolute;
        left: 8px;
        top: 7px;
        color: #6f5c40;
      }
      .j-task.now {
        background: rgba(193, 81, 47, 0.09);
        color: var(--ink);
      }
      .j-task.now::before { content: '\25B8'; color: #c1512f; }
      /* The Tasks tab as a page of her book: now (large) beside what this
       * place already gave you, and the places behind you folded below. */
      .jt {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        grid-template-rows: auto auto 1fr;
        column-gap: 22px;
        row-gap: 14px;
      }
      /* Her pencil note for the place sits at the foot of the sheet, so a
       * short page still reads as a whole page of her book. */
      .jt-nani {
        grid-column: 1 / -1;
        grid-row: -2 / -1;
        align-self: end;
        font-family: var(--hand);
        font-size: var(--fs-hand17);
        line-height: 1.3;
        color: #6b5334;
        border-top: 1px dashed rgba(43, 33, 24, 0.18);
        padding-top: 8px;
        transform: rotate(-0.4deg);
      }
      .jt-nani span {
        display: block;
        font-family: 'Literata', Georgia, serif;
        font-size: var(--fs-label);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #6b5334;
        transform: none;
      }
      .jt-nowcol, .jt-herecol { min-width: 0; }
      .jt-herecol { border-left: 1px solid rgba(43, 33, 24, 0.22); padding-left: 18px; }
      .jt-past { grid-column: 1 / -1; border-top: 1px dashed rgba(107, 83, 52, 0.45); padding-top: 8px; }
      .jt-place {
        font-family: var(--display);
        font-weight: 600;
        font-size: 22px;
        line-height: 1.15;
        margin-bottom: 12px;
        text-wrap: balance;
      }
      .jt-place span {
        display: block;
        font-family: 'Literata', Georgia, serif;
        font-weight: normal;
        font-style: italic;
        font-size: var(--fs-125);
        color: #6b5334;
        margin-top: 2px;
      }
      .jt-k {
        font-family: 'Literata', Georgia, serif;
        font-size: var(--fs-label);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #6b5334;
        margin: 0 0 6px;
      }
      .jt-k:not(:first-child) { margin-top: 14px; }
      .jt-now {
        font-size: 17.5px;
        line-height: 1.5;
        color: var(--ink);
        padding: 10px 12px 10px 14px;
        border-left: 3px solid #c1512f;
        background: rgba(193, 81, 47, 0.08);
        border-radius: 0 3px 3px 0;
      }
      .jt-now.quiet { font-style: italic; color: #57452f; border-left-color: rgba(107, 83, 52, 0.45); background: none; }
      .jt-bag { font-family: var(--hand); font-size: var(--fs-hand17); color: #6a4c2e; margin-top: 10px; transform: rotate(-0.4deg); }
      .jt-bag span {
        display: block;
        font-family: 'Literata', Georgia, serif;
        font-size: var(--fs-label);
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: #6b5334;
        transform: none;
      }
      .jt-also, .jt-done { list-style: none; margin: 0; padding: 0; }
      .jt-also li { font-size: var(--fs-13); color: #57452f; padding: 3px 0 3px 16px; position: relative; }
      .jt-also li::before { content: '\25E6'; position: absolute; left: 2px; color: #6f5c40; }
      /* Crossed off the way a pencil does it: a tick, and a line through
       * that still lets the words be read. */
      .jt-done li {
        font-size: var(--fs-13);
        line-height: 1.4;
        color: #6b5a42;
        padding: 3px 0 3px 20px;
        position: relative;
        text-decoration: line-through;
        text-decoration-color: rgba(107, 83, 52, 0.55);
        text-decoration-thickness: 1px;
      }
      .jt-done li::before {
        content: '\2713';
        position: absolute;
        left: 2px;
        top: 2px;
        color: #6b8e4e;
        font-weight: 600;
        text-decoration: none;
      }
      .jt-none { font-style: italic; color: #6f5c40; font-size: var(--fs-13); }
      .jt-marks { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 10px; align-items: center; }
      .jt-dish { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-12); color: #57452f; }
      .jt-dish i { display: inline-block; width: 52px; height: 38px; }
      .jt-dish canvas { display: block; width: 52px; height: 38px; }
      .jt-dish b { font-weight: normal; font-style: italic; }
      .jt-who {
        font-family: var(--hand);
        font-size: var(--fs-hand16);
        color: #5d4b35;
        padding: 0 8px;
        border: 1px solid rgba(107, 83, 52, 0.35);
        border-radius: 12px;
        line-height: 1.5;
      }
      .jt-leaf { padding: 4px 0; border-bottom: 1px dotted rgba(107, 83, 52, 0.3); }
      .jt-leaf summary {
        cursor: pointer;
        display: flex;
        align-items: baseline;
        gap: 10px;
        list-style: none;
        padding: 4px 2px;
      }
      .jt-leaf summary::-webkit-details-marker { display: none; }
      .jt-leaf summary::before { content: '\25B8'; color: #a3542f; font-size: 11px; transition: transform 0.15s; }
      .jt-leaf[open] summary::before { transform: rotate(90deg); }
      .jt-leaf-name { font-family: var(--display); font-size: 15px; color: var(--ink); }
      .jt-leaf-tally { font-size: var(--fs-12); font-style: italic; color: #6b5334; margin-left: auto; }
      .jt-leaf > .jt-done, .jt-leaf > .jt-marks { margin-left: 18px; margin-bottom: 6px; }
      /* The foot is ruled off from the page, and a page that scrolls fades out
       * above the rule instead of running its last line into the hint. */
      .j-hint {
        font-size: var(--fs-11);
        color: #6b5334;
        text-align: center;
        padding-top: 6px;
        margin-top: 4px;
        border-top: 1px solid rgba(43, 33, 24, 0.18);
      }
      .j-route, .j-list, .j-detail, .j-tasks {
        -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), transparent);
        mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), transparent);
        padding-bottom: 16px;
        box-sizing: border-box;
      }

      /* ---- journal photos: Chasca's prints, pasted where you can visit them ---- */
      .j-ph-grid {
        flex: 0 0 46%;
        min-width: 0;
        /* Without min-height a flex child refuses to shrink, so the pane
         * grew instead of scrolling and ran off the bottom of the window. */
        min-height: 0;
        overflow-y: auto;
        padding-right: 6px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 16px 12px;
        align-content: start;
        padding: 10px 14px 14px 6px;
      }
      .j-ph-print, .j-ph-slot {
        position: relative;
        margin: 0;
        min-width: 0;
        transform: rotate(var(--j-ph-tilt, 0deg));
      }
      .j-ph-print {
        padding: 4px 4px 2px;
        background: #faf6ea;
        border: 1px solid rgba(43, 33, 24, 0.18);
        box-shadow: 0 1px 2px rgba(20, 14, 8, 0.25), 0 4px 9px rgba(20, 14, 8, 0.16);
        color: #57452f;
      }
      .j-ph-print.sel {
        background: #fdfaf0;
        color: var(--ink);
        box-shadow: 0 0 0 2px rgba(193, 81, 47, 0.55), 0 4px 10px rgba(20, 14, 8, 0.2);
      }
      .j-ph-art canvas { display: block; width: 100%; height: auto; }
      .j-ph-cap {
        font-family: var(--hand);
        font-size: 12px;
        line-height: 1.15;
        color: #4c3a28;
        padding: 4px 2px 2px;
        transform: rotate(-0.4deg);
      }
      .j-ph-stamp {
        display: inline-block;
        margin: 1px 0 3px;
        padding: 1px 6px 0;
        font-family: var(--display);
        font-size: 8.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        white-space: nowrap;
        color: #a3542f;
        border: 1px solid rgba(163, 84, 47, 0.55);
        border-radius: 3px;
        background: rgba(250, 246, 234, 0.9);
        transform: rotate(-2deg);
      }
      /* The frames she has not taken yet: faint taped corners, name only. */
      .j-ph-slot {
        aspect-ratio: 240 / 170;
        border: 1.5px dashed rgba(43, 33, 24, 0.2);
        background: rgba(43, 33, 24, 0.04);
        display: grid;
        place-items: center;
        opacity: 0.75;
      }
      .j-ph-corner { position: absolute; width: 0; height: 0; border: 9px solid transparent; }
      .j-ph-corner.c1 { top: 3px; left: 3px; border-top-color: rgba(58, 44, 30, 0.4); border-left-color: rgba(58, 44, 30, 0.4); }
      .j-ph-corner.c2 { top: 3px; right: 3px; border-top-color: rgba(58, 44, 30, 0.4); border-right-color: rgba(58, 44, 30, 0.4); }
      .j-ph-corner.c3 { bottom: 3px; left: 3px; border-bottom-color: rgba(58, 44, 30, 0.4); border-left-color: rgba(58, 44, 30, 0.4); }
      .j-ph-corner.c4 { bottom: 3px; right: 3px; border-bottom-color: rgba(58, 44, 30, 0.4); border-right-color: rgba(58, 44, 30, 0.4); }
      .j-ph-name { font-size: var(--fs-11); font-style: italic; color: #6f5c40; padding: 0 6px; text-align: center; }
      /* The selected print, larger, in the detail pane. */
      .j-ph-big {
        margin: 8px auto 0;
        max-width: 300px;
        padding: 9px 9px 5px;
        background: #faf6ea;
        border: 1px solid rgba(43, 33, 24, 0.2);
        box-shadow: 0 2px 3px rgba(20, 14, 8, 0.3), 0 10px 22px rgba(20, 14, 8, 0.2);
        transform: rotate(-1.2deg);
      }
      .j-ph-big .j-ph-cap { font-size: 16px; padding: 7px 3px 4px; }
      .j-ph-big .j-ph-stamp { font-size: 9.5px; margin: 2px 0 4px; }

      /* ---- title screen ---- */
      #title, #letter {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(19, 14, 10, 0.86);
        backdrop-filter: blur(3px) saturate(0.9);
      }
      /* The star plain, remembered: a slow drift of faint stars over the title. */
      #title::before {
        content: '';
        position: absolute;
        inset: -20% 0 0 0;
        pointer-events: none;
        background-image:
          radial-gradient(1.6px 1.6px at 12% 22%, rgba(242,230,208,0.8), transparent 60%),
          radial-gradient(1.2px 1.2px at 34% 64%, rgba(242,230,208,0.55), transparent 60%),
          radial-gradient(2px 2px at 56% 18%, rgba(232,220,196,0.7), transparent 60%),
          radial-gradient(1.2px 1.2px at 71% 47%, rgba(242,230,208,0.5), transparent 60%),
          radial-gradient(1.7px 1.7px at 88% 28%, rgba(242,230,208,0.75), transparent 60%),
          radial-gradient(1.2px 1.2px at 22% 82%, rgba(242,230,208,0.45), transparent 60%),
          radial-gradient(1.5px 1.5px at 64% 84%, rgba(242,230,208,0.6), transparent 60%),
          radial-gradient(1.2px 1.2px at 45% 38%, rgba(242,230,208,0.5), transparent 60%),
          radial-gradient(1.8px 1.8px at 79% 68%, rgba(242,230,208,0.65), transparent 60%);
        animation: starDrift 90s linear infinite, starBreathe 5s ease-in-out infinite;
      }
      @keyframes starDrift { from { transform: translateY(0); } to { transform: translateY(12%); } }
      @keyframes starBreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #title::before { animation: none; } }
      #title[hidden], #letter[hidden], #journal[hidden], #textbox[hidden] { display: none; }

      /* ---- the cover: Nani's journal, lying open ----
       * The left page is her frontispiece (title, the painting she pasted
       * in, her caption); the right page is the contents, and the menu is
       * that contents list: leaders, folios that mean something, and the
       * woven band laid in as the bookmark on the chosen line. Her route
       * runs along the foot, inked as far as this journal has come. */
      .t-card { color: var(--ink); padding: 0 24px; }
      .cv {
        --cloth: #4a2418;
        --page: #f3e7cf;
        --page-edge: #e2d1ae;
        --rust: #9c3b22;
        --faint: #6b5334;
        --rule: rgba(43, 33, 24, 0.28);
        --pad: clamp(22px, 3.2vw, 40px);
        --title: clamp(38px, 5.4vw, 60px);
        --row: clamp(19px, 1.9vw, 23px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }
      /* The boards: bookcloth showing a finger's width round the pages. */
      .cv-book {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        box-sizing: border-box;
        width: min(calc(100vw - 48px), max(1040px, 60vw));
        padding: 12px;
        border-radius: 7px;
        background:
          url('assets/textures/bookcloth-weave.jpg') repeat,
          linear-gradient(160deg, #6b3624, var(--cloth) 55%, #3a1a11);
        background-blend-mode: multiply, normal;
        background-size: 380px, auto;
        box-shadow:
          inset 0 1px 0 rgba(255, 220, 180, 0.12),
          0 2px 4px rgba(12, 8, 4, 0.4),
          0 18px 40px rgba(12, 8, 4, 0.55),
          0 40px 80px rgba(12, 8, 4, 0.35);
      }
      .cv-page {
        position: relative;
        min-width: 0;
        padding: var(--pad);
        color: var(--ink);
        /* The aged-paper texture under a cream wash: its tooth, not its tan. */
        background:
          linear-gradient(rgba(247, 238, 218, 0.84), rgba(247, 238, 218, 0.84)),
          url('assets/textures/paper-aged-cream.jpg') center / 900px repeat,
          var(--page);
      }
      /* The gutter: each page curves down into the binding. */
      .cv-front {
        border-radius: 4px 1px 1px 4px;
        box-shadow: inset -26px 0 30px -18px rgba(70, 45, 20, 0.42), inset 1px 0 0 var(--page-edge);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .cv-contents {
        border-radius: 1px 4px 4px 1px;
        box-shadow: inset 26px 0 30px -18px rgba(70, 45, 20, 0.42), inset -1px 0 0 var(--page-edge);
        display: flex;
        flex-direction: column;
        padding-left: calc(var(--pad) + 26px);
      }
      /* The stitched fold between them. */
      .cv-book::after {
        content: '';
        position: absolute;
        top: 12px; bottom: 12px; left: 50%;
        width: 0;
        border-left: 1px dashed rgba(90, 60, 30, 0.35);
        pointer-events: none;
      }
      .cv-kicker {
        font-family: var(--hand);
        font-size: 22px;
        color: var(--rust);
        transform: rotate(-2deg);
        margin-bottom: 2px;
      }
      .cv-title {
        margin: 0;
        font-family: var(--display);
        font-weight: 650;
        font-size: var(--title);
        line-height: 0.98;
        letter-spacing: -0.012em;
        font-variation-settings: 'opsz' 144, 'SOFT' 60;
        word-spacing: 0.06em;
        color: var(--ink);
        text-wrap: balance;
      }
      /* Her painting, pasted in: photo corners, and the slight skew of a
       * picture fixed by hand. The steam rises from the bowl in it. */
      .cv-plate {
        position: relative;
        margin: clamp(22px, 3.6vh, 36px) 0 0;
        margin: clamp(22px, 3.6dvh, 36px) 0 0;
        width: min(100%, 400px);
        transform: rotate(-1.2deg);
      }
      .cv-plate canvas {
        display: block;
        width: 100%;
        height: auto;
        border: 5px solid #fbf6ea;
        box-shadow: 0 1px 2px rgba(40, 25, 10, 0.25), 0 6px 14px rgba(40, 25, 10, 0.22);
      }
      .cv-corner {
        position: absolute;
        width: 22px; height: 22px;
        background: linear-gradient(135deg, #3a2a1c 0 50%, transparent 50%);
        opacity: 0.88;
        z-index: 1;
      }
      .cv-corner.tl { top: -3px; left: -3px; }
      .cv-corner.tr { top: -3px; right: -3px; transform: rotate(90deg); }
      .cv-corner.br { bottom: -3px; right: -3px; transform: rotate(180deg); }
      .cv-corner.bl { bottom: -3px; left: -3px; transform: rotate(270deg); }
      .cv-plate .t-steam { bottom: 22%; z-index: 1; }
      .cv-plate .t-steam.s1 { left: calc(50% - 9px); }
      .cv-plate .t-steam.s2 { left: 50%; }
      .cv-plate .t-steam.s3 { left: calc(50% + 9px); }
      .cv-cap {
        margin: 10px 0 0;
        font-family: var(--hand);
        font-size: 19px;
        color: var(--faint);
        transform: rotate(-1deg);
      }
      .cv-sub {
        margin: 0;
        padding-top: 14px;
        max-width: 28em;
        font-size: var(--fs-145);
        font-style: italic;
        line-height: 1.5;
        color: var(--faint);
        text-wrap: balance;
      }
      /* ---- the contents page ---- */
      .cv-head {
        margin: 4px 0 clamp(14px, 2.6vh, 26px);
        margin: 4px 0 clamp(14px, 2.6dvh, 26px);
        font-family: var(--display);
        font-weight: 600;
        font-size: 15px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--rust);
      }
      .cv .t-menu { display: flex; flex-direction: column; gap: clamp(6px, 1.4vh, 12px); gap: clamp(6px, 1.4dvh, 12px); margin: 0; }
      .cv .t-opt {
        position: relative;
        font-family: var(--display);
        font-size: var(--row);
        color: var(--faint);
        transition: color 0.15s ease;
      }
      .cv .t-opt.sel { color: var(--ink); }
      .cv-line { display: flex; align-items: baseline; gap: 10px; }
      .cv-lab { font-weight: 450; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cv .t-opt.sel .cv-lab { font-weight: 620; }
      .cv-lead {
        flex: 1;
        min-width: 24px;
        border-bottom: 2px dotted rgba(43, 33, 24, 0.34);
        transform: translateY(-0.28em);
      }
      .cv-folio {
        font-family: 'Literata', Georgia, serif;
        font-size: 0.72em;
        font-variant-numeric: tabular-nums oldstyle-nums;
        color: var(--faint);
        white-space: nowrap;
      }
      .cv .t-opt-sub {
        display: block;
        margin-top: 2px;
        font-family: 'Literata', Georgia, serif;
        font-size: var(--fs-135);
        font-style: italic;
        color: var(--faint);
        text-wrap: balance;
      }
      /* The bookmark: the woven band, laid in from the head of the page and
       * ending in a forked tail on the chosen line. */
      .cv-ribbon {
        position: absolute;
        top: -14px;
        left: calc(var(--pad) - 6px);
        width: 15px;
        height: calc(var(--rib, 140px) + 14px + 9px);
        background: repeating-linear-gradient(
          180deg,
          #c1512f 0 10px, #d9a441 10px 20px, #3f7fb0 20px 30px, #6b8e4e 30px 40px
        );
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 9px), 0 100%);
        filter: drop-shadow(0 2px 2px rgba(40, 20, 8, 0.35));
        transition: height 0.26s cubic-bezier(.16, 1, .3, 1);
        z-index: 1;
      }
      /* Thirty lives remembered: with the old code in the save, the band
       * catches the light once as the cover comes up. */
      .cv-ribbon.shimmer::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, transparent 22%, rgba(255, 240, 200, 0.85) 50%, transparent 78%);
        background-size: 100% 300%;
        animation: bandShimmer 0.9s ease-in-out 0.5s 1 both;
      }
      @keyframes bandShimmer {
        from { background-position: 0 140%; }
        to { background-position: 0 -140%; }
      }
      /* Her advice from the first letter, in her hand in the margin: the
       * whole game, and the only instruction the contents page needs. */
      .cv-motto {
        margin: 0;
        padding-top: clamp(16px, 3vh, 32px);
        padding-top: clamp(16px, 3dvh, 32px);
        max-width: 23em;
        font-family: var(--hand);
        font-size: 21px;
        line-height: 1.2;
        color: #4d3d2b;
        transform: rotate(-1.4deg);
        transform-origin: left;
      }
      .cv-sig { margin-left: 10px; color: var(--rust); }
      /* Her route, along the foot: one stamp per stop, inked as far as this
       * journal has come; the furthest wears the red. */
      .cv-route { margin-top: auto; padding-top: clamp(12px, 2.2vh, 24px); padding-top: clamp(12px, 2.2dvh, 24px); }
      .cv-route-head {
        font-family: var(--hand);
        font-size: 19px;
        color: var(--faint);
        transform: rotate(-1deg);
        transform-origin: left;
      }
      .cv-stops {
        position: relative;
        display: flex;
        justify-content: space-between;
        list-style: none;
        margin: 8px 0 4px;
        padding: 0;
      }
      .cv-stops::before {
        content: '';
        position: absolute;
        left: 8px; right: 8px; top: 50%;
        border-top: 1.5px dashed var(--rule);
      }
      .cv-stop {
        position: relative;
        width: 16px; height: 16px;
        border-radius: 50%;
        border: 1.5px dotted rgba(43, 33, 24, 0.45);
        background: var(--page);
      }
      .cv-stop.inked {
        border: 2px solid rgba(43, 33, 24, 0.82);
        box-shadow: inset 0 0 0 2px var(--page), inset 0 0 0 5px rgba(43, 33, 24, 0.72);
        transform: rotate(var(--tilt));
      }
      .cv-stop.here {
        border-color: var(--rust);
        box-shadow: inset 0 0 0 2px var(--page), inset 0 0 0 5px var(--rust);
        transform: scale(1.3) rotate(var(--tilt));
      }
      .cv-sr {
        position: absolute;
        width: 1px; height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .cv-ends {
        display: flex;
        justify-content: space-between;
        font-size: var(--fs-125);
        color: var(--faint);
      }
      .cv-route-note {
        margin-top: 6px;
        font-size: var(--fs-13);
        font-style: italic;
        color: var(--faint);
      }
      .cv-fragile {
        margin: 12px 0 0;
        padding: 8px 10px;
        border-left: 3px solid var(--rust);
        font-size: var(--fs-13);
        line-height: 1.45;
        color: var(--ink);
        background: rgba(156, 59, 34, 0.07);
      }
      .t-opt.warn { color: #a3542f; font-size: 19px; }
      .t-steam {
        position: absolute;
        bottom: 30px;
        width: 3px; height: 22px;
        border-radius: 3px;
        background: linear-gradient(180deg, rgba(250, 244, 230, 0), rgba(250, 244, 230, 0.75));
        animation: steamRise 3.4s ease-in-out infinite;
        opacity: 0;
      }
      .t-steam.s1 { animation-delay: 0s; }
      .t-steam.s2 { animation-delay: 1.1s; height: 26px; }
      .t-steam.s3 { animation-delay: 2.2s; }
      @keyframes steamRise {
        0% { transform: translateY(6px) scaleY(0.6); opacity: 0; }
        35% { opacity: 0.8; }
        100% { transform: translateY(-16px) scaleY(1.15) translateX(3px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .t-steam { animation: none; opacity: 0.45; transform: none; }
        .cv-ribbon { transition: none; }
      }
      .t-nw { white-space: nowrap; }
      .t-arr {
        display: inline-block;
        animation: arrPulse 1.6s ease-in-out infinite;
      }
      @keyframes arrPulse {
        0%, 100% { opacity: 0.55; transform: translateX(0); }
        50% { opacity: 1; transform: translateX(2px); }
      }
      .t-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 26px;
        justify-content: center;
        font-size: var(--fs-125);
        color: #b9a27c;
      }
      .t-controls b {
        color: #f0dfb8;
        font-weight: 500;
      }
      /* Upright and narrow: the journal turned to read one page at a time,
       * her frontispiece above the contents, the fold between them across. */
      @media (max-width: 720px) {
        .t-card.cv { padding: 0 10px; }
        .cv { --pad: 22px; --title: clamp(34px, 11vw, 46px); --row: 20px; gap: 14px; }
        .cv-book { grid-template-columns: 1fr; width: min(100%, 460px); padding: 9px; }
        .cv { padding-bottom: 18px; }
        .cv-route-note { display: none; }
        .cv-book::after { display: none; }
        .cv-front {
          border-radius: 4px 4px 1px 1px;
          box-shadow: inset 0 -24px 28px -20px rgba(70, 45, 20, 0.42);
          padding-bottom: 18px;
        }
        .cv-contents {
          border-radius: 1px 1px 4px 4px;
          box-shadow: inset 0 24px 28px -20px rgba(70, 45, 20, 0.42);
          padding-top: 26px;
        }
        .cv-plate { width: min(66%, 270px); margin-top: 12px; }
        .cv-cap { margin-top: 6px; font-size: 16px; }
        .cv-sub { display: none; }
        .cv-motto { font-size: 18px; padding-top: 18px; }
        .cv .t-menu { gap: 6px; }
        .cv-ribbon { top: -9px; height: calc(var(--rib, 140px) + 9px + 9px); }
      }
      /* Lying down on a phone: both pages side by side, everything pared to
       * what fits under the browser's toolbar. */
      @media (min-width: 721px) and (max-height: 560px) {
        .cv { --pad: 16px; --title: clamp(26px, 7vh, 36px); --title: clamp(26px, 7dvh, 36px); --row: 17px; gap: 6px; }
        .cv-book { padding: 7px; width: min(calc(100vw - 24px), 900px); }
        .cv-kicker { font-size: 17px; }
        .cv-plate { width: min(100%, 250px); margin-top: 14px; }
        .cv-plate canvas { border-width: 3px; max-height: 34vh; max-height: 34dvh; object-fit: cover; }
        .cv-cap, .cv-sub, .cv-motto { display: none; }
        .cv-head { margin-bottom: 8px; font-size: 12px; }
        .cv .t-menu { gap: 4px; }
        .cv .t-opt-sub { font-size: 12px; }
        .cv-route { padding-top: 8px; }
        .cv-route-head, .cv-route-note { display: none; }
        .cv-ribbon { top: -7px; height: calc(var(--rib, 140px) + 7px + 9px); }
        .t-controls { display: none; }
      }

      /* ---- the shelf by the stove: three journals standing in their cloth ----
       * Each is a book on a plank: its cloth, the woven band tied round its
       * foot, a paper label down the spine in Nani's hand. The chosen one is
       * lifted a finger's height; the one open on the table trails the band
       * over its head as a bookmark. Beside them a card says who, where and
       * how far, and lists what can be done. */
      .sv {
        --page: #f3e7cf;
        --rust: #9c3b22;
        --faint: #6b5334;
        color: var(--ink);
      }
      .sv-room {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(24px, 4vw, 52px);
      }
      .sv-shelf { position: relative; padding: 0 22px; }
      .sv-books {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 330px;
        padding: 0 8px;
      }
      .sh-row.sv-spine {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 78px;
        height: 288px;
        padding: 18px 0 12px;
        box-sizing: border-box;
        border-radius: 5px 5px 2px 2px;
        cursor: pointer;
        background:
          linear-gradient(90deg, rgba(0,0,0,0.32), rgba(255,235,200,0.10) 22%, rgba(255,235,200,0.04) 60%, rgba(0,0,0,0.30)),
          url('assets/textures/bookcloth-weave.jpg') center / 260px repeat,
          var(--cloth);
        background-blend-mode: normal, multiply, normal;
        box-shadow: 0 2px 3px rgba(10, 6, 3, 0.5), inset 0 0 0 1px rgba(0, 0, 0, 0.25);
        transition: transform 0.22s cubic-bezier(.16, 1, .3, 1), box-shadow 0.22s ease;
      }
      /* Gold rules at head and foot, the way a cloth binding is finished. */
      .sh-row.sv-spine::before,
      .sh-row.sv-spine::after {
        content: '';
        position: absolute;
        left: 8px; right: 8px;
        height: 0;
        border-top: 2px solid rgba(217, 164, 65, 0.65);
        border-bottom: 1px solid rgba(217, 164, 65, 0.45);
        padding-top: 3px;
      }
      .sh-row.sv-spine::before { top: 8px; }
      .sh-row.sv-spine::after { bottom: 26px; }
      /* Drawn half out of the row: lifted, and leaning back on its neighbour,
       * with its own shadow still falling on the plank. */
      .sh-row.sv-spine.sel {
        transform: translateY(-12px);
        box-shadow: 0 12px 6px -6px rgba(10, 6, 3, 0.55), 0 16px 24px rgba(10, 6, 3, 0.35), inset 0 0 0 1px rgba(0, 0, 0, 0.25);
      }
      .sh-row.sv-spine.blank {
        --cloth: #c9b994;
        background:
          linear-gradient(90deg, rgba(60,40,20,0.22), rgba(255,250,240,0.18) 22%, rgba(60,40,20,0.2)),
          url('assets/textures/linen-soft.jpg') center / 220px repeat,
          var(--cloth);
      }
      .sv-label {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 46px;
        margin: 10px 0 8px;
        padding: 10px 0;
        box-sizing: border-box;
        background: linear-gradient(rgba(247, 238, 218, 0.9), rgba(247, 238, 218, 0.9)), url('assets/textures/paper-aged-cream.jpg') center / 400px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      /* The name fits the label: a long one is written smaller, as a hand
       * would, never cut off with an ellipsis. */
      .sv-name {
        writing-mode: vertical-rl;
        font-family: var(--hand);
        font-size: clamp(14px, calc(330px / var(--len, 6)), 25px);
        line-height: 1;
        color: var(--ink);
        white-space: nowrap;
      }
      .sv-spine.blank .sv-label { background: none; box-shadow: inset 0 0 0 1.5px rgba(80, 60, 35, 0.35); }
      /* The band, tied round the foot of every journal of hers. */
      .sv-band {
        width: 100%;
        height: 12px;
        background: repeating-linear-gradient(90deg, #c1512f 0 9px, #d9a441 9px 18px, #3f7fb0 18px 27px, #6b8e4e 27px 36px);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
      .sv-spine.blank .sv-band { opacity: 0.3; }
      .sv-no {
        margin-top: 6px;
        font-family: var(--display);
        font-size: 13px;
        letter-spacing: 0.08em;
        color: #f4e3bd;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.5);
      }
      .sv-spine.blank .sv-no { color: rgba(60, 42, 22, 0.6); }
      /* The journal open on the table: its bookmark trails over the head. */
      .sv-tail {
        position: absolute;
        top: -26px;
        left: 50%;
        width: 13px;
        height: 40px;
        margin-left: -6px;
        background: repeating-linear-gradient(180deg, #c1512f 0 8px, #d9a441 8px 16px, #3f7fb0 16px 24px, #6b8e4e 24px 32px);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 7px), 0 100%);
        transform: rotate(6deg);
        transform-origin: bottom;
        z-index: -1;
      }
      .sv-plank {
        height: 18px;
        margin: 0 -8px;
        border-radius: 2px;
        background: linear-gradient(180deg, #7a4a2a 0, #5d3820 40%, #3f2614 100%);
        box-shadow: 0 6px 14px rgba(10, 6, 3, 0.55), inset 0 1px 0 rgba(255, 210, 160, 0.25);
      }
      .sh-card.sv-card {
        position: relative;
        width: min(380px, 88vw);
        box-sizing: border-box;
        padding: 26px 28px 20px;
        border-radius: 4px;
        text-align: left;
        color: var(--ink);
        background:
          linear-gradient(rgba(247, 238, 218, 0.86), rgba(247, 238, 218, 0.86)),
          url('assets/textures/paper-aged-cream.jpg') center / 900px repeat,
          var(--page);
        box-shadow: 0 2px 4px rgba(12, 8, 4, 0.4), 0 16px 34px rgba(12, 8, 4, 0.45);
        min-height: 440px;
        display: flex;
        flex-direction: column;
      }
      .sh-kicker {
        font-family: var(--hand);
        font-size: 19px;
        color: var(--rust);
        transform: rotate(-1.5deg);
        transform-origin: left;
      }
      .sh-heading {
        margin: 2px 0 16px;
        font-family: var(--display);
        font-weight: 650;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        font-variation-settings: 'opsz' 144, 'SOFT' 60;
      }
      .sv-detail { min-height: 96px; padding: 12px 0 14px; border-top: 1.5px dotted rgba(43, 33, 24, 0.3); }
      .sh-fly { font-family: var(--hand); font-size: 30px; line-height: 1.05; }
      .sh-mark {
        margin-top: 2px;
        font-family: 'Literata', Georgia, serif;
        font-size: var(--fs-125);
        font-style: italic;
        color: var(--rust);
      }
      .sh-where { margin-top: 6px; font-size: var(--fs-15); color: var(--ink); }
      .sh-when { margin-top: 3px; font-size: var(--fs-135); font-style: italic; color: var(--faint); }
      .sh-verbs {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        padding-top: 4px;
        font-family: var(--display);
        font-size: 19px;
      }
      .sh-verb {
        position: relative;
        padding: 3px 0 3px 22px;
        color: var(--faint);
        cursor: pointer;
      }
      .sh-verb.on { color: var(--ink); font-weight: 620; }
      /* The same bookmark as the contents page, in miniature: a forked tail
       * beside the chosen deed. */
      .sh-verb.on::before {
        content: '';
        position: absolute;
        left: 2px; top: 6px;
        width: 11px; height: 19px;
        background: repeating-linear-gradient(180deg, #c1512f 0 5px, #d9a441 5px 10px, #3f7fb0 10px 15px, #6b8e4e 15px 20px);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 5px), 0 100%);
      }
      .sh-verb.warn,

      .sh-note {

      .sh-verbs { margin-bottom: 14px; }
      .sh-hint {

      @media (prefers-reduced-motion: reduce) {

      /* Upright and narrow: the shelf above, the card below. */
      @media (max-width: 720px) {
        .sv-room { flex-direction: column; align-items: center; gap: 22px; }
        .sv-books { height: 236px; gap: 8px; }
        .sh-row.sv-spine { width: 64px; height: 208px; }
        .sv-name { font-size: clamp(12px, calc(240px / var(--len, 6)), 21px); }
        .sh-card.sv-card { min-height: 0; }
      }
      /* Lying down on a phone: shorter books, the card beside them. */
      @media (min-width: 721px) and (max-height: 560px) {
        .sv-room { align-items: center; }
        .sv-books { height: 220px; }
        .sh-row.sv-spine { height: 190px; width: 62px; }
        .sh-heading { font-size: 22px; margin-bottom: 8px; }
        .sh-card.sv-card { padding: 16px 20px 12px; min-height: 0; }
        .sv-detail { min-height: 0; padding: 8px 0 8px; }
        .sh-fly { font-size: 24px; }
        .sh-verbs { font-size: 16px; gap: 0; }
        .sh-hint { display: none; }

      /* ---- the confirm card: a real question before anything is erased ---- */
      .cf-veil {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 12px 16px;
        background: rgba(12, 9, 6, 0.6);
      }
      .cf-card {
        width: min(100%, 440px);
        box-sizing: border-box;
        max-height: 100%;
        overflow-y: auto;
        padding: 20px 22px 14px;
        border-radius: 6px;
        text-align: center;
        color: #2b2118;
        background: url('assets/textures/paper-aged-cream.jpg') repeat, #f2e6d0;
        background-blend-mode: multiply, normal;
        background-size: 512px, auto;
        box-shadow: var(--shadow-card);
        transform: rotate(-0.6deg);
      }
      .cf-kicker {
        font-family: var(--hand);
        font-size: 22px;
        color: #a3542f;

      .cf-line {

        color: #3d2c1e;
      }
      .cf-btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 14px; }
      .cf-btn {
        font: inherit;
        font-family: 'Literata', Georgia, serif;
        font-size: 15px;
        padding: 8px 16px;
        min-height: 40px;

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Say Yes to Soup</title>
    <meta name="theme-color" content="#f4ead6" />
    <meta property="og:title" content="Say Yes to Soup" />
    <meta
      property="og:description"
      content="An unhurried journey through the world's kitchens, finishing the journal your grandmother began."
    />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/shubhamgoel27/say-yes-to-soup/main/docs/shots/delhi-rooftop-dusk.png"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f4ead6'/%3E%3Cpath d='M5 18h22c0 5.5-4.5 9-8.5 9h-5c-4 0-8.5-3.5-8.5-9z' fill='%23c1512f'/%3E%3Cellipse cx='16' cy='18' rx='11' ry='2.4' fill='%23d9a441'/%3E%3Cpath d='M11.5 13.5c-1.8-2 1.8-3.6 0-5.6M20.5 13.5c-1.8-2 1.8-3.6 0-5.6M16 12.5c-2.2-2.4 2.2-4.6 0-7' stroke='%232b2118' stroke-width='1.7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /*
       * The UI conceit: every surface you read is a page of Nani's journal.
       * Fraunces for what is printed, Literata for what is read, Caveat for
       * what a hand wrote (hers, Pilar's, yours). Ink is never pure black;
       * shadows are tinted with the same dusk as the world.
       */
      :root {
        color-scheme: dark;
        --ink: #2b2118;
        --ink-soft: #57452f;
        --paper: #f4ead6;
        --paper-dark: #e6d7bb;
        --gold: #c8a55b;
        --terracotta: #c1512f;
        --thread: repeating-linear-gradient(
          90deg,
          #c1512f 0 10px, #d9a441 10px 20px, #3f7fb0 20px 30px, #6b8e4e 30px 40px
        );
        --display: 'Fraunces', Georgia, serif;
        --hand: 'Caveat', 'Segoe Script', cursive;
        --shadow-card: 0 2px 3px rgba(31, 22, 12, 0.28), 0 10px 28px rgba(31, 22, 12, 0.34),
          0 24px 70px rgba(20, 14, 8, 0.4);
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #17120e;
        overflow: hidden;
        font-family: 'Literata', Georgia, 'Times New Roman', serif;
      }
      ::selection { background: rgba(200, 165, 91, 0.4); color: #1c1410; }
      #stage {
        position: fixed;
        inset: 0;
      }
      #frame {
        position: relative;
        width: 100vw;
        height: 100vh;
        line-height: 0;
        overflow: hidden;
      }
      /* The Canvas2D world buffer is offscreen; PixiJS presents fullscreen. */
      #game { display: none; }
      #stagegl { display: block; }
      /* Everything layered over the canvas lives here. */
      #hud {
        position: absolute;
        inset: 0;
        line-height: 1.45;
        pointer-events: none;
      }

      /* ---- village nameplate ---- */
      #plate {
        position: absolute;
        top: 7%;
        left: 50%;
        transform: translate(-50%, 6px);
        padding: 8px 24px 7px 28px;
        color: #f2e6d0;
        background: rgba(23, 18, 14, 0.78);
        border: 1px solid rgba(200, 165, 91, 0.35);
        border-radius: 2px;
        font-family: var(--display);
        font-size: 14px;
        letter-spacing: 0.34em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 1.1s ease, transform 1.1s ease;
      }
      #plate::before, #plate::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 14px;
        height: 1px;
        background: rgba(200, 165, 91, 0.55);
      }
      #plate::before { left: 8px; }
      #plate::after { right: 8px; }
      #plate.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---- toasts: "a page filled" whispers ---- */
      /* Overlays that carry the story mute the ambient HUD around them. */
      body.quiet-hud #toasts, body.quiet-hud #errand, body.quiet-hud #plate {
        opacity: 0;
        transition: opacity 0.25s ease;
      }
      #toasts {
        position: absolute;
        top: 16px;
        right: 16px;
        transition: opacity 0.25s ease;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
      }
      .toast {
        padding: 6px 12px;
        background: rgba(244, 234, 214, 0.94);
        color: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 2px;
        box-shadow: 2px 2px 0 rgba(43, 33, 24, 0.45);
        font-size: 13.5px;
        font-style: italic;
        opacity: 0;
        transform: translateX(10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .toast.in { opacity: 1; transform: translateX(0); }

      /* ---- errand chip ---- */
      #errand {
        position: absolute;
        top: 16px;
        left: 16px;
        max-width: min(38%, 380px);
        padding: 6px 12px;
        background: rgba(23, 18, 14, 0.82);
        color: #e8dcc4;
        border: 1px solid rgba(200, 165, 91, 0.4);
        border-radius: 3px;
        font-size: 12.5px;
        font-style: italic;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        transition: opacity 0.25s ease;
      }
      #errand::before { content: '\2709\00a0\00a0'; font-style: normal; }

      /* ---- dialogue box ---- */
      #textbox {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: min(92vw, 860px);
        bottom: 18px;
        display: flex;
        gap: 12px;
        padding: 12px 14px 10px;
        background:
          linear-gradient(rgba(244, 234, 214, 0.97), rgba(236, 223, 197, 0.97));
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: 0 2px 3px rgba(31, 22, 12, 0.3), 0 10px 26px rgba(31, 22, 12, 0.35);
        color: var(--ink);
      }
      /* Woven trim along the top, from the locked palette. */
      #textbox::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        right: 2px;
        height: 4px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 8px, #c8a55b 8px 14px, #5f9fc4 14px 20px, #c8a55b 20px 26px
        );
        opacity: 0.85;
      }
      /* The portrait is a snapshot, taped into the page at a slight angle. */
      #tb-portrait {
        flex: 0 0 auto;
        align-self: flex-start;
        position: relative;
        margin-top: 8px;
        padding: 4px 4px 8px;
        background: #fbf6ea;
        border-radius: 1px;
        transform: rotate(-2deg);
        box-shadow: 0 1px 2px rgba(31, 22, 12, 0.3), 0 4px 10px rgba(31, 22, 12, 0.25);
      }
      #tb-portrait::before {
        content: '';
        position: absolute;
        top: -7px; left: 50%;
        width: 34px; height: 12px;
        transform: translateX(-50%) rotate(1.5deg);
        background: rgba(222, 205, 165, 0.7);
        box-shadow: 0 1px 2px rgba(31, 22, 12, 0.15);
      }
      #tb-portrait canvas {
        display: block;
        width: 60px;
        height: 60px;
        image-rendering: pixelated;
        box-shadow: none;
        border-radius: 0;
      }
      #tb-main { position: relative; flex: 1; min-width: 0; padding-top: 4px; }
      #tb-name[hidden], #tb-portrait[hidden] { display: none; }
      /* The speaker's name: a small ink chip, hand-cut, pressed into sepia. */
      #tb-name {
        display: inline-block;
        margin-bottom: 4px;
        padding: 1.5px 10px 2.5px;
        border: 1px solid rgba(87, 69, 47, 0.35);
        color: #57452f;
        border-radius: 9px 11px 10px 8px / 10px 8px 11px 9px;
        font-family: var(--display);
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.03em;
        transform: rotate(-0.6deg);
        background: rgba(87, 69, 47, 0.13);
        box-shadow: inset 0 1px 0 rgba(255, 252, 244, 0.4);
      }
      #tb-text {
        font-size: 16.5px;
        min-height: 48px; /* two lines: the box breathes but never yawns */
        text-wrap: pretty;
      }
      #tb-text.narrator { font-style: italic; color: #4c3d2e; }
      /* The continue cue: a quill resting its ink on the page, breathing. */
      #tb-arrow {
        position: absolute;
        right: 4px;
        bottom: 4px;
        font-size: 0; /* the old glyph retires; the dot below speaks */
      }
      #tb-arrow::after {
        content: '';
        display: block;
        width: 7px;
        height: 7px;
        border-radius: 50% 50% 50% 44%;
        background: #7a3b22;
        animation: quillDot 1.5s ease-in-out infinite;
      }
      @keyframes quillDot {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 0.85; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        #tb-arrow::after { animation: none; opacity: 0.7; }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(3px); }
      }
      #tb-choices {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 4px;
      }
      /* Choices hang like a list in a margin; a manicule points at yours. */
      .tb-choice {
        padding: 1px 8px 1px 26px;
        text-indent: -8px;
        font-size: 15px;
        position: relative;
      }
      .tb-choice.sel {
        background: rgba(43, 33, 24, 0.07);
        border-radius: 2px;
      }
      .tb-choice.sel::before {
        content: '\261E';
        position: absolute;
        left: 5px;
        text-indent: 0;
        color: var(--terracotta);
      }
      .tb-choice:hover, .tb-choice.sel {
        text-decoration: underline;
        text-decoration-color: rgba(193, 81, 47, 0.55);
        text-decoration-thickness: 1.5px;
        text-underline-offset: 3px;
      }

      /* ---- journal overlay ---- */
      #journal {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.55);
      }
      .j-book {
        width: 82%;
        max-width: 620px;
        height: 78%;
        display: flex;
        flex-direction: column;
        background:
          linear-gradient(rgba(244, 234, 214, 0.78), rgba(244, 234, 214, 0.78)),
          url('/assets/textures/paper-aged-cream.jpg') repeat,
          linear-gradient(120deg, var(--paper), var(--paper-dark));
        background-blend-mode: normal, multiply, normal;
        background-size: auto, 480px, auto;
        border: 2px solid var(--ink);
        border-radius: 4px;
        box-shadow: var(--shadow-card);
        color: var(--ink);
        padding: 14px 18px 10px;
        line-height: 1.45;
      }
      .j-book.opening { animation: bookOpen 0.22s ease-out; }
      @keyframes bookOpen {
        from { transform: translateY(10px) scale(0.96); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .j-book, .letter-paper, .w-panel { animation: none !important; }
      }
      .j-head { display: flex; justify-content: space-between; align-items: baseline; }
      .j-name { font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: 0.01em; }
      .j-progress { font-size: 12.5px; font-style: italic; color: #6b5a44; font-variant-numeric: tabular-nums; }
      /* Physical index tabs, cut into the page edge like a real notebook. */
      .j-tabs {
        display: flex;
        gap: 3px;
        margin: 10px -6px 12px;
        border-bottom: 1.5px solid rgba(43, 33, 24, 0.4);
      }
      .j-tab {
        padding: 4px 12px 3px;
        font-size: 13px;
        color: #8a755a;
        background: linear-gradient(180deg, rgba(43, 33, 24, 0.06), rgba(43, 33, 24, 0.12));
        border: 1.5px solid rgba(43, 33, 24, 0.3);
        border-bottom: none;
        border-radius: 7px 7px 0 0;
        transform: translateY(1.5px);
      }
      .j-tab.on {
        color: var(--ink);
        background: var(--paper);
        border-color: rgba(43, 33, 24, 0.4);
        font-weight: 600;
        transform: translateY(1.5px) scale(1.04);
      }
      .j-body { display: flex; gap: 16px; flex: 1; min-height: 0; }
      .j-list { flex: 0 0 38%; overflow: hidden; font-size: 14.5px; }
      .j-item { padding: 2px 6px; color: #57452f; }
      .j-item.sel {
        background: rgba(43, 33, 24, 0.09);
        border-radius: 2px;
        color: var(--ink);
      }
      .j-locked { margin-top: 8px; font-size: 12.5px; font-style: italic; color: #a08c6b; }
      .j-detail { flex: 1; min-width: 0; border-left: 1px solid rgba(43,33,24,0.25); padding-left: 16px; overflow: hidden; }
      .j-title { font-family: var(--display); font-weight: 600; font-size: 19px; text-wrap: balance; }
      .j-sub { font-size: 13px; font-style: italic; color: #6b5a44; margin-bottom: 8px; }
      .j-nani, .j-you { font-size: 14px; margin-top: 8px; }
      .j-nani {
        font-family: var(--hand);
        font-size: 17.5px;
        line-height: 1.3;
        color: #8a7455;
        transform: rotate(-0.4deg);
      }
      .j-nani.empty { opacity: 0.55; }
      .j-nani span, .j-you span {
        display: block;
        font-family: 'Literata', Georgia, serif;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        opacity: 0.65;
        font-style: normal;
        transform: none;
      }
      /* Every entry separates her hand from yours the same way. */
      .j-nani { border-top: 1px dashed rgba(43, 33, 24, 0.18); padding-top: 8px; }
      .j-nani.empty { border-top: 1px dashed rgba(43, 33, 24, 0.12); }
      .j-empty { font-style: italic; color: #7a6749; margin-top: 20px; font-size: 14.5px; }
      .j-stitch { color: #c1512f; font-size: 12px; }
      .j-thread { font-family: var(--hand); font-size: 17px; line-height: 1.3; margin-top: 10px; color: #7a5a3a; transform: rotate(-0.5deg); }
      .j-thread span {
        display: block;
        font-family: 'Literata', Georgia, serif;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        opacity: 0.65;
        font-style: normal;
      }
      .j-thread-rule {
        height: 3px;
        margin: 10px 0 8px;
        border-radius: 2px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 10px, #d9a441 10px 20px, #3f7fb0 20px 30px, #6b8e4e 30px 40px
        );
        opacity: 0.75;
      }
      .j-thread-to { font-size: 12px; font-style: normal; color: #a3542f; margin-top: 6px; }
      .j-native { font-size: 15px; color: #7a5a3a; margin-left: 8px; font-weight: normal; }
      .j-dishart { margin: 6px 0 8px; }
      .j-dishart canvas { display: block; width: 165px; height: auto; border-radius: 4px; }
      .j-route { flex: 1; overflow-y: auto; padding-right: 8px; }
      .j-route-stop { padding: 4px 2px; opacity: 0.55; }
      .j-route-stop.been { opacity: 0.85; }
      .j-route-stop.here { opacity: 1; }
      .j-route-head { display: flex; align-items: baseline; gap: 8px; }
      .j-route-glyph { width: 16px; text-align: center; color: #c1512f; }
      .j-route-name { font-size: 15.5px; }
      .j-route-stop.here .j-route-name { color: var(--ink); font-weight: 600; }
      .j-route-hop { font-size: 12px; font-style: italic; color: #8a7455; }
      .j-route-nani { font-family: var(--hand); font-size: 16px; color: #8a7455; margin: 0 0 2px 24px; }
      .j-route-nani.empty { opacity: 0.6; }
      .j-route-stitch {
        width: 2px; height: 8px; margin-left: 9px;
        background: repeating-linear-gradient(180deg, #b59a72 0 3px, transparent 3px 6px);
      }
      .j-tasks { flex: 1; overflow-y: auto; padding-right: 6px; }
      .j-task {
        font-size: 14px;
        line-height: 1.5;
        padding: 8px 10px 8px 26px;
        margin-bottom: 8px;
        position: relative;
        border-radius: 3px;
        color: #57452f;
      }
      .j-task::before {
        content: '\25E6';
        position: absolute;
        left: 8px;
        top: 7px;
        color: #a08c6b;
      }
      .j-task.now {
        background: rgba(193, 81, 47, 0.09);
        color: var(--ink);
      }
      .j-task.now::before { content: '\25B8'; color: #c1512f; }
      .j-hint { font-size: 11px; color: #8a7455; text-align: center; padding-top: 6px; }

      /* ---- title screen ---- */
      #title, #letter {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(19, 14, 10, 0.86);
        backdrop-filter: blur(3px) saturate(0.9);
      }
      /* The star plain, remembered: a slow drift of faint stars over the title. */
      #title::before {
        content: '';
        position: absolute;
        inset: -20% 0 0 0;
        pointer-events: none;
        background-image:
          radial-gradient(1.6px 1.6px at 12% 22%, rgba(242,230,208,0.8), transparent 60%),
          radial-gradient(1.2px 1.2px at 34% 64%, rgba(242,230,208,0.55), transparent 60%),
          radial-gradient(2px 2px at 56% 18%, rgba(232,220,196,0.7), transparent 60%),
          radial-gradient(1.2px 1.2px at 71% 47%, rgba(242,230,208,0.5), transparent 60%),
          radial-gradient(1.7px 1.7px at 88% 28%, rgba(242,230,208,0.75), transparent 60%),
          radial-gradient(1.2px 1.2px at 22% 82%, rgba(242,230,208,0.45), transparent 60%),
          radial-gradient(1.5px 1.5px at 64% 84%, rgba(242,230,208,0.6), transparent 60%),
          radial-gradient(1.2px 1.2px at 45% 38%, rgba(242,230,208,0.5), transparent 60%),
          radial-gradient(1.8px 1.8px at 79% 68%, rgba(242,230,208,0.65), transparent 60%);
        animation: starDrift 90s linear infinite, starBreathe 5s ease-in-out infinite;
      }
      @keyframes starDrift { from { transform: translateY(0); } to { transform: translateY(12%); } }
      @keyframes starBreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #title::before { animation: none; } }
      #title[hidden], #letter[hidden], #journal[hidden], #textbox[hidden] { display: none; }

      /* The title screen IS the journal: her cloth cover, your hand hovering. */
      .t-card { text-align: center; color: #e8dcc4; padding: 0 24px; }
      .t-cover {
        position: relative;
        width: min(88vw, 430px);
        padding: 40px 34px 30px;
        border-radius: 8px 14px 14px 8px;
        background:
          url('/assets/textures/bookcloth-weave.jpg') repeat,
          linear-gradient(160deg, #7a4c38 0%, #61392a 46%, #4e2f23 100%);
        background-blend-mode: multiply, normal;
        background-size: 420px, auto;
        box-shadow:
          inset 0 1px 0 rgba(255, 230, 190, 0.14),
          inset 0 -2px 6px rgba(0, 0, 0, 0.35),
          var(--shadow-card);
      }
      /* Stitching around the cover, and the spine's shadow on the left. */
      .t-cover::before {
        content: '';
        position: absolute;
        inset: 9px;
        border: 1.5px dashed rgba(232, 220, 196, 0.32);
        border-radius: 5px 10px 10px 5px;
        pointer-events: none;
      }
      .t-cover::after {
        content: '';
        position: absolute;
        top: 0; bottom: 0; left: 0;
        width: 16px;
        border-radius: 8px 0 0 8px;
        background: linear-gradient(90deg, rgba(0,0,0,0.32), rgba(0,0,0,0) 90%);
        pointer-events: none;
      }
      /* The woven band that keeps the journal shut, worn from opening it. */
      .t-band {
        position: absolute;
        top: 14px; bottom: 14px;
        right: 52px;
        width: 14px;
        background: repeating-linear-gradient(
          180deg,
          #c1512f 0 12px, #d9a441 12px 24px, #3f7fb0 24px 36px, #6b8e4e 36px 48px
        );
        border-radius: 3px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(43, 33, 24, 0.35);
        opacity: 0.95;
      }
      .t-kicker {
        font-family: var(--hand);
        font-size: 21px;
        color: #d9c298;
        margin-bottom: 6px;
        transform: rotate(-1.6deg);
      }
      .t-name {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(34px, 6vw, 46px);
        line-height: 1.12;
        letter-spacing: 0.1em;
        margin-left: 0.1em;
        color: #efd9a8;
        text-wrap: balance;
        text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.55), 0 1px 0 rgba(255, 236, 200, 0.12);
      }
      /* The cover painting: the whole journey in one gouache. */
      .t-art {
        position: relative;
        margin: 14px 0 10px;
      }
      .t-art canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 6px;
        border: 1.5px solid rgba(43, 33, 24, 0.55);
        box-shadow: inset 0 0 0 1.5px rgba(232, 220, 196, 0.18), 0 3px 8px rgba(0, 0, 0, 0.35);
      }
      .t-art .t-steam { bottom: 30px; }
      .t-art .t-steam.s1 { left: calc(50% - 9px); }
      .t-art .t-steam.s2 { left: 50%; }
      .t-art .t-steam.s3 { left: calc(50% + 9px); }
      .t-opt.warn { color: #a3542f; font-size: 19px; }

      /* The bowl the whole game is named after, steaming patiently. */
      .t-bowl {
        position: relative;
        width: 74px;
        height: 46px;
        margin: 16px auto 6px;
      }
      .t-bowl .bowl {
        position: absolute;
        left: 50%; bottom: 4px;
        transform: translateX(-50%);
        width: 58px; height: 26px;
        border-radius: 4px 4px 29px 29px;
        background: linear-gradient(180deg, #b5713f, #8a5330);
        box-shadow: inset 0 3px 0 rgba(60, 36, 20, 0.6), 0 3px 6px rgba(0, 0, 0, 0.4);
      }
      .t-bowl .bowl::before {
        content: '';
        position: absolute;
        left: 4px; right: 4px; top: -3px;
        height: 8px;
        border-radius: 50%;
        background: #d9a441;
        box-shadow: inset 0 -2px 3px rgba(120, 70, 20, 0.55);
      }
      .t-steam {
        position: absolute;
        bottom: 30px;
        width: 3px; height: 22px;
        border-radius: 3px;
        background: linear-gradient(180deg, rgba(242, 230, 208, 0), rgba(242, 230, 208, 0.65));
        animation: steamRise 3.4s ease-in-out infinite;
        opacity: 0;
      }
      .t-steam.s1 { left: 26px; animation-delay: 0s; }
      .t-steam.s2 { left: 36px; animation-delay: 1.1s; height: 26px; }
      .t-steam.s3 { left: 46px; animation-delay: 2.2s; }
      @keyframes steamRise {
        0% { transform: translateY(6px) scaleY(0.6); opacity: 0; }
        35% { opacity: 0.8; }
        100% { transform: translateY(-16px) scaleY(1.15) translateX(3px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .t-steam { animation: none; opacity: 0.45; transform: none; }
      }
      .t-sub {
        font-size: 13.5px;
        font-style: italic;
        color: #c4ac83;
        max-width: 300px;
        margin: 0 auto 20px;
        text-wrap: pretty;
      }
      .t-menu { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
      .t-opt {
        font-family: var(--hand);
        font-size: 24px;
        color: #a8906a;
        transition: color 0.15s ease, transform 0.15s ease;
      }
      .t-opt.sel { color: #f4e6c8; transform: rotate(-1deg) scale(1.04); }
      /* Under Continue: where the journey paused, and how far the journal is. */
      .t-opt-sub {
        font-family: 'Literata', Georgia, serif;
        font-size: 11.5px;
        font-style: italic;
        letter-spacing: 0.02em;
        color: #8a7455;
        margin-top: -3px;
      }
      .t-opt.sel .t-opt-sub { color: #c4ac83; }
      .t-controls {
        display: flex;
        gap: 22px;
        justify-content: center;
        margin-top: 22px;
        font-size: 12px;
        color: #8a7455;
      }
      .t-controls b { color: #c8a55b; font-weight: normal; }

      /* ---- Nani's letter ---- */
      /* The clip below eats box-shadow, so the fold wrapper casts it instead,
         hugging the deckled silhouette. */
      .letter-fold {
        width: 78%;
        max-width: 538px; /* the paper's old 470px content plus its padding */
        filter: drop-shadow(0 2px 3px rgba(31, 22, 12, 0.35))
          drop-shadow(0 12px 30px rgba(20, 14, 8, 0.5));
      }
      .letter-fold .letter-paper { width: auto; }
      .letter-paper {
        position: relative;
        width: 78%;
        max-width: 470px;
        background: linear-gradient(#f4ead6, #e9dabb);
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: var(--shadow-card);
        padding: 25px 32px 6px;
        color: #3d3022;
        background-image:
          repeating-linear-gradient(180deg, transparent 0 27px, rgba(122, 90, 58, 0.14) 27px 28px),
          url('/assets/textures/paper-grain-white.jpg'),
          linear-gradient(#f4ead6, #e9dabb);
        background-blend-mode: normal, multiply, normal;
        background-position: 0 23px, 0 0, 0 0;
        animation: letterOpen 0.4s ease-out;
        /* A deckled edge: this sheet was torn from a larger book, gently. */
        clip-path: polygon(
          0.4% 0.5%, 8% 0.15%, 17% 0.6%, 27% 0.1%, 38% 0.55%, 49% 0.2%, 60% 0.6%,
          70% 0.05%, 81% 0.5%, 91% 0.15%, 99.6% 0.55%,
          99.9% 9%, 99.5% 20%, 99.9% 33%, 99.45% 47%, 99.9% 61%, 99.5% 74%, 99.9% 88%, 99.55% 99.4%,
          91% 99.9%, 80% 99.5%, 69% 99.9%, 58% 99.45%, 47% 99.9%, 36% 99.5%, 25% 99.9%, 14% 99.55%, 4% 99.9%, 0.35% 99.5%,
          0.1% 89%, 0.55% 76%, 0.1% 62%, 0.5% 48%, 0.1% 34%, 0.55% 21%, 0.1% 9%
        );
      }
      /* A drop of sealing wax in the corner, pressed with a thumb. */
      .letter-paper::after {
        content: '';
        position: absolute;
        top: 13px;
        right: 17px;
        width: 15px;
        height: 15px;
        border-radius: 48% 52% 50% 50% / 53% 47% 52% 48%;
        background: radial-gradient(circle at 38% 34%, #bf5c3b, #9c3a20 58%, #872e19);
        box-shadow: inset 0 0 0 2.5px rgba(122, 32, 15, 0.3), inset 1px 2px 2px rgba(255, 226, 190, 0.25),
          0 1px 2px rgba(31, 22, 12, 0.3);
        transform: rotate(8deg);
      }
      @keyframes letterOpen {
        from { transform: translateY(16px) rotate(-0.6deg) scale(0.97); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      .letter-body {
        font-family: var(--hand);
        font-size: 20px;
        line-height: 28px; /* exactly one rule per written line */
        color: #43331f;
      }
      .letter-body p { margin: 0 0 28px; }
      .letter-body b { letter-spacing: 0.04em; }
      .letter-sign { text-align: right; margin: 0 0 0; }
      .letter-hint {
        text-align: center;
        font-size: 11.5px;
        color: #a08c6b;
        padding-top: 6px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

      /* ---- weaving mini-game ---- */
      #weave {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.55);
      }
      #weave[hidden] { display: none; }
      /* Overlay roots hang off #frame's line-height: 0; panels need real leading. */
      .w-panel { line-height: 1.45; }
      .g-stage { margin: 10px 0 8px; }
      .g-stage canvas { box-shadow: inset 0 0 0 1.5px rgba(43, 33, 24, 0.35); }
      .w-panel {
        width: 62%;
        max-width: 430px;
        background: linear-gradient(#f4ead6, #e9dabb);
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: var(--shadow-card);
        padding: 14px 20px 12px;
        color: var(--ink);
        text-align: center;
        animation: bookOpen 0.2s ease-out;
      }
      .w-title { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.08em; margin-bottom: 8px; }
      .w-cloth {
        min-height: 40px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        align-items: center;
        justify-content: center;
        padding: 6px 0 10px;
      }
      .w-row { display: flex; gap: 2px; }
      .w-row span { width: 22px; height: 9px; border-radius: 1px; display: inline-block; }
      .w-empty { font-size: 12px; font-style: italic; color: #a08c6b; }
      .w-seq { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
      .w-cell {
        width: 30px;
        height: 30px;
        border: 2px solid var(--ink);
        border-radius: 3px;
        transition: transform 0.12s ease;
      }
      .w-cell.on { transform: scale(1.12); }
      .w-hint { font-size: 13.5px; font-style: italic; min-height: 20px; margin-bottom: 10px; }
      .w-legend { display: flex; gap: 14px; justify-content: center; }
      .w-key { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
      .w-key i { width: 14px; height: 14px; border: 1px solid var(--ink); border-radius: 2px; display: inline-block; }

      /* ---- pause: a rest, on paper ---- */
      #pause {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.6);
        backdrop-filter: blur(2px);
      }
      #pause[hidden] { display: none; }
      .p-card {
        width: min(86vw, 460px);
        background:
          linear-gradient(rgba(244, 234, 214, 0.78), rgba(244, 234, 214, 0.78)),
          url('/assets/textures/paper-aged-cream.jpg') repeat,
          linear-gradient(120deg, var(--paper), var(--paper-dark));
        background-blend-mode: normal, multiply, normal;
        background-size: auto, 480px, auto;
        border: 2px solid var(--ink);
        border-radius: 4px;
        box-shadow: var(--shadow-card);
        color: var(--ink);
        padding: 20px 28px 22px;
        animation: bookOpen 0.22s ease-out;
      }
      .p-title {
        font-family: var(--display);
        font-weight: 600;
        font-size: 22px;
        margin-bottom: 12px;
      }
      .p-menu { display: flex; flex-direction: column; gap: 6px; }
      .p-opt {
        font-family: var(--hand);
        font-size: 23px;
        color: #8a755a;
        transition: color 0.15s ease, transform 0.15s ease;
      }
      .p-opt.sel { color: var(--ink); transform: rotate(-0.8deg) scale(1.03); }
      .p-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 4px 2px;
        font-size: 15px;
        color: #6b5a44;
      }
      .p-row.sel { color: var(--ink); }
      .p-label { font-family: var(--hand); font-size: 20px; }
      .p-value { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
      .p-hint-line { margin-top: 10px; font-size: 12px; font-style: italic; color: #8a7455; }
      .p-note {
        margin-top: 14px;
        font-family: var(--hand);
        font-size: 18px;
        line-height: 1.35;
        color: #7a5a3a;
        transform: rotate(-0.4deg);
      }
      .p-credits { font-size: 14px; line-height: 1.5; }
      .p-credits p { margin: 0 0 8px; }
      .p-c-head { font-family: var(--display); font-weight: 600; font-size: 17px; }
      .p-c-sec { color: #57452f; }

      /* ---- reduce motion: calm is also a setting ---- */
      body.reduce-motion * { animation: none !important; transition: none !important; }

      /* ---- chapter mini-games (roots created by the engine) ---- */
      .mg-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.55);
      }
      .mg-overlay[hidden] { display: none; }
      .c-track {
        position: relative;
        height: 44px;
        margin: 6px 4px 8px;
        border: 2px solid var(--ink);
        border-radius: 22px;
        background: linear-gradient(#7fb3c4, #4e8fa6);
        overflow: hidden;
      }
      .c-zone {
        position: absolute;
        left: 4%;
        width: 20%;
        top: 0;
        bottom: 0;
        background: rgba(242, 230, 208, 0.28);
        border-right: 2px dashed rgba(242, 230, 208, 0.7);
      }
      .c-zone.wide { left: 30%; width: 40%; border-left: 2px dashed rgba(242,230,208,0.7); }
      .c-horse, .c-rider {
        position: absolute;
        top: 50%;
        width: 20px;
        height: 20px;
        border-radius: 50% 50% 40% 40%;
        background: #d0b276;
        border: 2px solid var(--ink);
        transform: translate(-50%, -50%);
      }
      .c-horse { left: 12%; }
      .c-wave {
        position: absolute;
        top: -4px;
        bottom: -4px;
        width: 16px;
        border-radius: 8px;
        background: linear-gradient(#f2fbff, #8fcbe8);
        border: 2px solid rgba(43, 33, 24, 0.55);
      }
      .c-count { font-size: 13px; letter-spacing: 0.3em; margin-bottom: 6px; color: #57452f; }
      .n-grid { display: grid; gap: 3px; margin: 8px 2px 10px; }
      .n-cell {
        aspect-ratio: 1;
        border: 1.6px solid rgba(60, 110, 110, 0.8);
        border-radius: 2px;
        background: rgba(60, 110, 110, 0.12);
      }
      .n-cell.hole { background: rgba(23, 18, 14, 0.5); border-style: dashed; }
      .n-cell.cur { outline: 3px solid #c1512f; outline-offset: -1px; }

      /* ---- door-transition fade ---- */
      #fade {
        position: absolute;
        inset: 0;
        background: #17120e;
        opacity: 0;
        pointer-events: none;
      }

      /* ---- the iris wipe: a hole in the dark, closing and opening ---- */
      #iris {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 0;
        height: 0;
        border-radius: 50%;
        pointer-events: none;
        display: none;
      }

      /* ---- the journey card: a held breath between regions ---- */
      #journeycard {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.55s ease;
        color: #e8dcc4;
      }
      #journeycard.show { opacity: 1; }
      #journeycard .jc-stamp {
        display: inline-block;
        padding: 18px 34px 16px;
        border: 2.5px solid rgba(200, 120, 80, 0.8);
        outline: 1.5px solid rgba(200, 120, 80, 0.55);
        outline-offset: 4px;
        border-radius: 10px;
        transform: rotate(-3deg) scale(1.25);
        opacity: 0;
        transition: transform 0.35s cubic-bezier(0.2, 1.6, 0.4, 1), opacity 0.3s ease;
        color: #d9926a;
      }
      #journeycard.show .jc-stamp { transform: rotate(-3deg) scale(1); opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        #journeycard .jc-stamp { transition: opacity 0.3s ease; transform: rotate(-3deg); }
      }
      .jc-name {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(24px, 4vw, 40px);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .jc-rule {
        width: 120px;
        height: 3px;
        margin: 14px auto 12px;
        border-radius: 2px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 12px, #d9a441 12px 24px, #3f7fb0 24px 36px, #6b8e4e 36px 48px
        );
        opacity: 0.85;
      }
      .jc-hop { font-family: var(--hand); font-size: 22px; color: #cbb794; margin-top: 16px; }

      /* ---- debug ---- */
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 9px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #c8a55b;
        background: #17120ecc;
        border: 1px solid #2b2118;
        white-space: pre;
        pointer-events: none;
        display: none;
      }
      #debug[data-on='1'] { display: block; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="frame">
        <canvas id="game"></canvas>
        <div id="hud">
          <div id="plate"></div>
          <div id="toasts"></div>
          <div id="errand" hidden></div>
          <div id="textbox" hidden>
            <div id="tb-portrait"></div>
            <div id="tb-main">
              <div id="tb-name"></div>
              <div id="tb-text"></div>
              <div id="tb-arrow">&#9662;</div>
              <div id="tb-choices"></div>
            </div>
          </div>
          <div id="journal" hidden></div>
          <div id="weave" hidden></div>
          <div id="pause" hidden></div>
          <div id="fade"></div>
          <div id="iris"></div>
          <div id="journeycard"></div>
          <div id="letter" hidden></div>
          <div id="title" hidden></div>
        </div>
      </div>
    </div>
    <pre id="debug"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

      }
      .cf-btn.sel { border-color: #2b2118; background: #fffaf0; box-shadow: 0 0 0 2px rgba(200, 165, 91, 0.7); }
      .cf-btn.cf-act { color: #8f3a1e; }
      .cf-btn.cf-act.sel { border-color: #a3542f; box-shadow: 0 0 0 2px rgba(193, 81, 47, 0.45); }
      .cf-hint { margin-top: 10px; font-size: var(--fs-11); color: #5a4632; }

      /* ---- Nani's letter ---- */
      /* The clip below eats box-shadow, so the fold wrapper casts it instead,
         hugging the deckled silhouette. */
      .letter-fold {
        width: 78%;
        max-width: 538px; /* the paper's old 470px content plus its padding */
        filter: drop-shadow(0 2px 3px rgba(31, 22, 12, 0.35))
          drop-shadow(0 12px 30px rgba(20, 14, 8, 0.5));
      }
      .letter-fold .letter-paper { width: auto; }
      .letter-paper {
        position: relative;
        width: 78%;
        max-width: 470px;
        background: linear-gradient(#f4ead6, #e9dabb);
        border-radius: 3px;
        /* A loose sheet tucked in the book: its own lined paper and torn
         * edge, no ruled frame (the fold around it casts the shadow). */
        padding: 25px 32px 14px;
        color: #3d3022;
        background-image:
          repeating-linear-gradient(180deg, transparent 0 27px, rgba(122, 90, 58, 0.14) 27px 28px),
          url('assets/textures/paper-grain-white.jpg'),
          linear-gradient(#f4ead6, #e9dabb);
        background-blend-mode: normal, multiply, normal;
        /* The rule is the last px of each 28px band, so a rule lands at
         * 19 + 27 = 46px: one px under the first line's baseline (Caveat 20px
         * on a 28px line, 25px of padding, measured at 45px). At 23px every
         * line floated 5px above its rule. */
        background-position: 0 19px, 0 0, 0 0;
        animation: letterOpen 0.4s ease-out;
        /* A deckled edge: this sheet was torn from a larger book, gently. */
        clip-path: polygon(
          0.4% 0.5%, 8% 0.15%, 17% 0.6%, 27% 0.1%, 38% 0.55%, 49% 0.2%, 60% 0.6%,
          70% 0.05%, 81% 0.5%, 91% 0.15%, 99.6% 0.55%,
          99.9% 9%, 99.5% 20%, 99.9% 33%, 99.45% 47%, 99.9% 61%, 99.5% 74%, 99.9% 88%, 99.55% 99.4%,
          91% 99.9%, 80% 99.5%, 69% 99.9%, 58% 99.45%, 47% 99.9%, 36% 99.5%, 25% 99.9%, 14% 99.55%, 4% 99.9%, 0.35% 99.5%,
          0.1% 89%, 0.55% 76%, 0.1% 62%, 0.5% 48%, 0.1% 34%, 0.55% 21%, 0.1% 9%
        );
      }
      /* A drop of sealing wax in the corner, pressed with a thumb. */
      .letter-paper::after {
        content: '';
        position: absolute;
        top: 13px;
        right: 17px;
        width: 15px;
        height: 15px;
        border-radius: 48% 52% 50% 50% / 53% 47% 52% 48%;
        background: radial-gradient(circle at 38% 34%, #bf5c3b, #9c3a20 58%, #872e19);
        box-shadow: inset 0 0 0 2.5px rgba(122, 32, 15, 0.3), inset 1px 2px 2px rgba(255, 226, 190, 0.25),
          0 1px 2px rgba(31, 22, 12, 0.3);
        transform: rotate(8deg);
      }
      @keyframes letterOpen {
        from { transform: translateY(16px) rotate(-0.6deg) scale(0.97); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      .letter-body {
        font-family: var(--hand);
        font-size: 20px;
        line-height: 28px; /* exactly one rule per written line */
        color: #43331f;
      }
      .letter-body p { margin: 0 0 28px; }
      .letter-body b { letter-spacing: 0.04em; }
      .letter-sign { text-align: right; margin: 0 0 0; }
      /* A telegram was struck on a machine; only the note about it is in hand. */
      .letter-paper.typed .letter-body p:not(.letter-sign) {
        font-family: 'Courier Prime', 'Courier New', Courier, ui-monospace, monospace;
        font-size: 15px;
        letter-spacing: 0.06em;
        font-weight: 600;
        /* Courier's baseline sits 3px higher in the 28px line than Caveat's;
         * nudged down so the struck lines rest on the rules too. */
        position: relative;
        top: 3px;
      }
      .letter-hint {
        text-align: center;
        font-size: var(--fs-125);
        font-style: italic;
        color: #5a4630;
        padding-top: 8px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.7; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .letter-hint { animation: none; opacity: 0.85; }
      }

      /* ---- the chapter-close spread: the journal closes a chapter ---- */
      #chapterclose {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(19, 14, 10, 0.78);
        backdrop-filter: blur(2px) saturate(0.92);
        pointer-events: auto;
        cursor: pointer;
      }
      #chapterclose[hidden] { display: none; }
      .cx-card {
        width: min(86vw, 440px);
        background:
          linear-gradient(rgba(244, 234, 214, 0.78), rgba(244, 234, 214, 0.78)),
          url('assets/textures/paper-aged-cream.jpg') repeat,
          linear-gradient(120deg, var(--paper), var(--paper-dark));
        background-blend-mode: normal, multiply, normal;
        background-size: auto, 480px, auto;
        border: 2px solid var(--ink);
        border-radius: 4px;
        box-shadow: var(--shadow-card);
        color: var(--ink);
        padding: 24px 32px 14px;
        line-height: 1.45;
        max-height: 86vh;
        max-height: 86dvh;
        overflow-y: auto;
        text-align: center;
        animation: letterOpen 0.4s ease-out;
      }
      .cx-kicker {
        font-family: var(--display);
        font-size: var(--fs-115);
        font-weight: 600;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #6b5637;
      }
      .cx-name {
        font-family: var(--display);
        font-weight: 600;
        font-size: 26px;
        margin-top: 6px;
      }
      /* The woven band, a few threads of this coast's colors. */
      .cx-band {
        width: 128px;
        height: 6px;
        margin: 10px auto 0;
        border: 1px solid rgba(43, 33, 24, 0.55);
        border-radius: 1px;
        transform: rotate(-0.5deg);
      }
      .cx-sub { font-size: var(--fs-125); font-style: italic; color: #5d4b35; }
      .cx-pockets {
        margin: 16px auto 0;
        padding-top: 12px;
        border-top: 1px dashed rgba(107, 83, 52, 0.45);
      }
      .cx-pockets .cx-sub { margin-bottom: 4px; }
      .cx-row { font-size: var(--fs-145); color: #43331f; }
      .cx-n { font-variant-numeric: tabular-nums; font-weight: 600; }
      .cx-her { margin-top: 6px; font-size: var(--fs-135); color: #a3542f; }
      .cx-photo { margin-top: 6px; font-size: var(--fs-115); font-style: italic; color: #6f5c40; }
      /* A tiny pasted print: four mounting corners around a blank frame. */
      .cx-print {
        display: inline-block;
        width: 26px;
        height: 19px;
        margin-right: 8px;
        vertical-align: -4px;
        background:
          linear-gradient(#2b2118, #2b2118) left top / 8px 2px,
          linear-gradient(#2b2118, #2b2118) left top / 2px 8px,
          linear-gradient(#2b2118, #2b2118) right top / 8px 2px,
          linear-gradient(#2b2118, #2b2118) right top / 2px 8px,
          linear-gradient(#2b2118, #2b2118) left bottom / 8px 2px,
          linear-gradient(#2b2118, #2b2118) left bottom / 2px 8px,
          linear-gradient(#2b2118, #2b2118) right bottom / 8px 2px,
          linear-gradient(#2b2118, #2b2118) right bottom / 2px 8px,
          rgba(244, 234, 214, 0.85);
        background-repeat: no-repeat;
        transform: rotate(-2deg);
      }
      .cx-onward {
        margin: 16px auto 0;
        padding-top: 12px;
        border-top: 1px dashed rgba(107, 83, 52, 0.45);
      }
      .cx-next { font-family: var(--display); font-weight: 600; font-size: 19px; margin-top: 2px; }
      .cx-hop { font-family: 'Literata', Georgia, serif; font-weight: normal; font-size: var(--fs-125); font-style: italic; color: #6b5334; }
      .cx-nani {
        font-family: var(--hand);
        font-size: var(--fs-hand175);
        line-height: 1.3;
        color: #6a4c2e;
        margin: 6px auto 0;
        max-width: 330px;
        transform: rotate(-0.5deg);
      }
      .cx-nani.empty { font-style: italic; color: #8a7455; }
      .cx-go {
        font-family: var(--hand);
        font-size: 24px;
        color: var(--ink);
        margin-top: 16px;
        transform: rotate(-0.8deg);
      }
      .cx-go::before { content: '\25B8\00a0'; color: #a3542f; }
      .cx-hint {
        font-size: var(--fs-11);
        color: #6f5c40;
        padding-top: 4px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .cx-card { animation: none; }
        .cx-hint { animation: none; opacity: 0.85; }
      }

      /* ---- cc: the flyleaf card (name + the traveler's look) ---- */
      #cc-card {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(19, 14, 10, 0.86);
        backdrop-filter: blur(3px) saturate(0.9);
        pointer-events: auto;
      }
      #cc-card[hidden] { display: none; }
      /* The flyleaf is a bookplate pasted inside the cover: a double-ruled
       * frame, the woven band along its head, and a line to sign. */
      .cc-paper {
        position: relative;
        width: min(88vw, 440px);
        box-sizing: border-box;
        background:
          repeating-linear-gradient(90deg, #c1512f 0 14px, #d9a441 14px 28px, #3f7fb0 28px 42px, #6b8e4e 42px 56px) top / 100% 9px no-repeat,
          linear-gradient(rgba(247, 238, 218, 0.86), rgba(247, 238, 218, 0.86)),
          url('assets/textures/paper-aged-cream.jpg') center / 900px repeat,
          #f3e7cf;
        border-radius: 3px;
        box-shadow: 0 2px 4px rgba(12, 8, 4, 0.4), 0 18px 40px rgba(12, 8, 4, 0.5);
        color: #43331f;
        padding: 42px 40px 32px;
        text-align: center;
        line-height: 1.45;
        animation: ccOpen 0.4s ease-out;
      }
      .cc-paper::before {
        content: '';
        position: absolute;
        inset: 19px 10px 10px;
        border: 3px double rgba(43, 33, 24, 0.42);
        border-radius: 2px;
        pointer-events: none;
      }
      @keyframes ccOpen {
        from { transform: translateY(16px) rotate(-0.6deg) scale(0.97); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .cc-paper { animation: none; }
      }
      .cc-kicker {
        font-family: var(--display);
        font-size: var(--fs-13);
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #9c3b22;
        margin-bottom: 10px;
      }
      .cc-belongs {
        font-family: var(--display);
        font-size: var(--fs-145);
        font-style: italic;
        color: #6b5334;
        margin-bottom: 2px;
      }
      .cc-copy {
        font-family: var(--hand);
        font-size: 21px;
        line-height: 1.25;
        color: #43331f;
        max-width: 320px;
        margin: 0 auto 16px;
        text-wrap: balance;
        transform: rotate(-0.4deg);
      }
      .cc-input {
        display: block;
        width: 64%;
        margin: 0 auto 4px;
        padding: 0 0 3px;
        font-family: var(--hand);
        font-size: 30px;
        text-align: center;
        color: var(--ink);
        background: transparent;
        border: none;
        border-bottom: 1.5px dashed rgba(43, 33, 24, 0.4);
        border-radius: 0;
        outline: none;
        caret-color: #7a3b22;
      }
      .cc-input:focus { border-bottom: 2px solid #9c3b22; }
      .cc-input::placeholder { color: rgba(122, 90, 58, 0.58); }
      .cc-fig {
        position: relative;
        height: 140px;
        display: grid;
        place-items: end center;
        margin: 0 auto 12px;
      }
      /* A pencil-soft contact shadow, so the sketch stands on the page. */
      .cc-fig::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: 1px;
        width: 44px;
        height: 8px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: rgba(43, 33, 24, 0.16);
        filter: blur(1.5px);
      }
      .cc-fig canvas { position: relative; z-index: 1; width: 84px; height: 134px; }
      .cc-rows {
        display: flex;
        flex-direction: column;
        gap: 3px;
        max-width: 300px;
        margin: 0 auto 8px;
      }
      .cc-row {
        display: grid;
        grid-template-columns: 30px 1fr 30px;
        align-items: center;
        padding: 3px 4px;
        border-radius: 3px;
        color: #5d4b35;
      }
      .cc-row.sel { background: rgba(156, 59, 34, 0.08); box-shadow: inset 3px 0 0 #9c3b22; color: var(--ink); }
      .cc-arr {
        font-family: var(--display);
        font-size: 22px;
        line-height: 1;
        color: #a3542f;
        opacity: 0.5;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
      }
      .cc-row.sel .cc-arr, .cc-arr:hover { opacity: 1; }
      /* A fixed label column, swatches from a fixed edge: rows of three and
       * four start in the same place. */
      .cc-mid {
        display: grid;
        grid-template-columns: 70px 1fr;
        align-items: center;
        gap: 14px;
      }
      .cc-lab { font-family: var(--hand); font-size: 20px; text-align: right; }
      .cc-mid .cc-dots { justify-self: start; }
      .cc-dots { display: inline-flex; gap: 9px; align-items: center; }
      .cc-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1px solid rgba(43, 33, 24, 0.45);
        box-shadow: inset 0 1px 1px rgba(255, 252, 244, 0.35);
      }
      .cc-dot.on { outline: 1.5px solid #7a3b22; outline-offset: 2px; }
      .cc-dot { cursor: pointer; }
      .cc-actions { margin-top: 2px; }
      /* The deed, set as a label on the plate rather than a web button:
       * ruled in rust, with the same woven tail the menus use. */
      .cc-btn {
        position: relative;
        margin-top: 10px;
        font-family: var(--display);
        font-size: 19px;
        font-weight: 620;
        letter-spacing: 0.02em;
        color: #7e2f1a;
        background: rgba(156, 59, 34, 0.06);
        border: 1.5px solid rgba(156, 59, 34, 0.7);
        border-radius: 2px;
        padding: 7px 22px 8px 34px;
        cursor: pointer;
      }
      .cc-btn::before {
        content: '';
        position: absolute;
        left: 11px; top: 50%;
        width: 11px; height: 19px;
        margin-top: -10px;
        background: repeating-linear-gradient(180deg, #c1512f 0 5px, #d9a441 5px 10px, #3f7fb0 10px 15px, #6b8e4e 15px 20px);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 5px), 0 100%);
      }
      .cc-btn:focus-visible { outline: 2px solid #3f7fb0; outline-offset: 3px; }
      .cc-btn:hover { background: rgba(156, 59, 34, 0.12); }
      .cc-hint {
        font-size: var(--fs-12);
        color: #5f4a30;
        padding-top: 14px;
      }

      /* ---- weaving mini-game ---- */
      #weave {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.55);
      }
      #weave[hidden] { display: none; }
      /* Overlay roots hang off #frame's line-height: 0; panels need real leading. */
      .w-panel { line-height: 1.45; }
      .g-stage { margin: 10px 0 8px; }
      .g-stage canvas { box-shadow: inset 0 0 0 1.5px rgba(43, 33, 24, 0.35); }
      .w-panel {
        /* The scenes inside are painted 640 logical px wide. This cap was
         * set for the old bar-and-dot panels and never revisited, so every
         * minigame was being shown at 45% of the pixels it was drawn at,
         * which made Sicily's hand-painted card faces unreadable. */
        width: 74%;
        max-width: 700px;
        background: linear-gradient(#f4ead6, #e9dabb);
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: var(--shadow-card);
        padding: 14px 20px 12px;
        color: var(--ink);
        text-align: center;
        animation: bookOpen 0.2s ease-out;
      }
      .w-title { font-family: var(--display); font-weight: 600; font-size: 17px; letter-spacing: 0.08em; margin-bottom: 8px; }
      .w-cloth {
        min-height: 40px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        align-items: center;
        justify-content: center;
        padding: 6px 0 10px;
      }
      .w-row { display: flex; gap: 2px; }
      .w-row span { width: 22px; height: 9px; border-radius: 1px; display: inline-block; }
      .w-empty { font-size: var(--fs-12); font-style: italic; color: #6f5c40; }
      .w-seq { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
      .w-cell {
        width: 30px;
        height: 30px;
        border: 2px solid var(--ink);
        border-radius: 3px;
        transition: transform 0.12s ease;
      }
      .w-cell.on { transform: scale(1.12); }
      /* Two lines held open: a caption that wraps to a second line used to
       * grow the card and jump the painting ~20px. (Not flex: captions carry
       * inline <b> and <br>, which flex would split into columns.) */
      .w-hint {
        font-size: var(--fs-135);
        font-style: italic;
        line-height: 1.4;
        min-height: 2.8em;
        margin-bottom: 10px;
        text-wrap: balance;
      }
      /* The key legend: the how-to card leaves, the keys stay. One row, the
       * same shape in every panel, quiet enough to sit under the painting. */
      .w-legend {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
        margin: 2px 0 2px;
        padding-top: 7px;
        border-top: 1px solid rgba(43, 33, 24, 0.16);
      }
      /* Sized and inked to be read mid-play, not squinted at: 13px words in
       * a solid brown (8.7:1 on the paper, up from 5.6:1) and 12px caps. */
      .w-key {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: var(--fs-13);
        font-style: normal;
        letter-spacing: 0.01em;
        color: #4a3a28;
      }
      .w-key i {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 19px;
        height: 18px;
        padding: 0 5px;
        margin-right: -2px;
        border: 1px solid rgba(43, 33, 24, 0.72);
        border-top-color: rgba(43, 33, 24, 0.35);
        border-radius: 3px;
        background: rgba(255, 252, 244, 0.62);
        box-shadow: 0 1px 0 rgba(43, 33, 24, 0.18);
        font-family: var(--display);
        font-style: normal;
        font-size: 12px;
        line-height: 1;
        color: var(--ink);
      }
      .w-key i + i { margin-left: 3px; }

      /* ---- pause: a rest, on paper ---- */
      #pause {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.6);
        backdrop-filter: blur(2px);
      }
      #pause[hidden] { display: none; }
      /* A page of the journal, held open at the rest: the woven band along
       * its head, and the same small bookmark beside the chosen line as on
       * the shelf's card. */
      .p-card {
        width: min(86vw, 460px);
        box-sizing: border-box;
        background:
          repeating-linear-gradient(90deg, #c1512f 0 14px, #d9a441 14px 28px, #3f7fb0 28px 42px, #6b8e4e 42px 56px) top / 100% 7px no-repeat,
          linear-gradient(rgba(247, 238, 218, 0.86), rgba(247, 238, 218, 0.86)),
          url('assets/textures/paper-aged-cream.jpg') center / 900px repeat,
          #f3e7cf;
        border-radius: 3px;
        box-shadow: 0 2px 4px rgba(12, 8, 4, 0.4), 0 18px 40px rgba(12, 8, 4, 0.5);
        color: var(--ink);
        padding: 30px 32px 22px;
        max-height: 86vh;
        max-height: 86dvh;
        overflow-y: auto;
      }
      .p-card.opening {
        animation: bookOpen 0.22s ease-out;
      }
      .p-title {
        font-family: var(--display);
        font-weight: 650;
        font-size: 30px;
        line-height: 1.05;
        letter-spacing: -0.01em;
        font-variation-settings: 'opsz' 144, 'SOFT' 60;
        word-spacing: 0.08em;
        margin-bottom: 16px;
        padding-bottom: 12px;
        border-bottom: 1.5px dotted rgba(43, 33, 24, 0.3);
      }
      .p-lead {
        flex: 1;
        min-width: 20px;
        border-bottom: 2px dotted rgba(43, 33, 24, 0.34);
        transform: translateY(-0.28em);
      }
      .p-menu { display: flex; flex-direction: column; gap: 4px; }
      /* One quiet line under the rest: the journey is written down. */
      .p-saved {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px dashed rgba(43, 33, 24, 0.25);
        font-size: var(--fs-12);
        font-style: italic;
        color: #6b5334;
      }
      .p-saved.lost { color: #8a3a1e; }
      .p-opt {
        position: relative;
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 3px 0 3px 24px;
        font-family: var(--display);
        font-size: 20px;
        color: #6b5334;
        transition: color 0.15s ease;
      }
      .p-opt.sel { color: var(--ink); }
      .p-opt.sel .p-opt-lab { font-weight: 620; }
      .p-folio {
        font-family: 'Literata', Georgia, serif;
        font-size: 0.72em;
        font-variant-numeric: tabular-nums oldstyle-nums;
        color: #6b5334;
      }
      /* The bookmark in miniature: the woven band's forked tail on the line. */
      .p-opt.sel::before,
      .p-row.sel .p-label::before {
        content: '';
        position: absolute;
        left: 3px; top: 50%;
        width: 11px; height: 19px;
        margin-top: -10px;
        background: repeating-linear-gradient(180deg, #c1512f 0 5px, #d9a441 5px 10px, #3f7fb0 10px 15px, #6b8e4e 15px 20px);
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% calc(100% - 5px), 0 100%);
      }
      /* The games shelf: won games under small chapter headings. */
      .p-games { gap: 3px; }
      .p-g-chapter {
        margin: 8px 0 1px;
        font-size: var(--fs-12);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #8a7350;
      }
      .p-games .p-g-chapter:first-child { margin-top: 2px; }
      .p-g-row { font-size: 21px; }
      .p-row {
        position: relative;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding: 4px 2px 4px 24px;
        font-size: var(--fs-15);
        color: #5d4b35;
      }
      .p-row.sel { color: var(--ink); }
      .p-label { font-family: var(--display); font-size: 18px; }
      .p-row.sel .p-label { font-weight: 620; }
      .p-value { font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
      /* A volume reads as a ramp: ten steps rising left to right, the
       * empty ones drawn as pale outlines. */
      .p-bar { display: inline-flex; align-items: flex-end; gap: 3px; height: 16px; vertical-align: middle; }
      .p-cell { display: block; width: 6px; height: calc(5px + var(--i, 0) * 1.1px); border-radius: 1px; border: 1px solid currentColor; opacity: 0.3; box-sizing: border-box; }
      .p-cell.on { background: currentColor; opacity: 0.85; }
      .p-key {
        display: inline-block;
        min-width: 1.4em;
        margin-left: 6px;
        padding: 0 4px;
        border: 1px solid rgba(43, 33, 24, 0.35);
        border-bottom-width: 2px;
        border-radius: 3px;
        font-size: 0.8em;
        text-align: center;
        color: #6b5334;
      }
      .p-hint-line { margin-top: 12px; font-size: var(--fs-125); font-style: italic; color: #5f4a30; }
      .p-g-all {
        margin-top: 12px;
        font-family: var(--hand);
        font-size: 17px;
        color: var(--terracotta);
        transform: rotate(-0.6deg);
      }
      .p-note {
        margin-top: 14px;
        font-family: var(--hand);
        font-size: 18px;
        line-height: 1.35;
        color: #6a4c2e;
        transform: rotate(-0.4deg);
      }
      .p-credits { font-size: var(--fs-14); line-height: 1.5; }
      .p-credits p { margin: 0 0 8px; }
      .p-c-head { font-family: var(--display); font-weight: 600; font-size: 17px; }
      .p-c-sec { color: #57452f; }
      /* The thanks come before the licences, in the hand the journal is kept in. */
      .p-c-thanks {
        font-family: var(--hand);
        font-size: 19px;
        line-height: 1.3;
        color: #6a3a22;
        border-left: 2px solid var(--terracotta);
        padding-left: 10px;
        transform: rotate(-0.3deg);
      }

      /* ---- Chasca's album: prints on cream card, card on dark cloth ---- */
      #album {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: auto;
        cursor: pointer;
        background:
          radial-gradient(120% 110% at 50% 38%, rgba(64, 46, 34, 0.55), rgba(21, 14, 10, 0.85)),
          rgba(23, 18, 14, 0.92);
      }
      #album[hidden] { display: none; }
      .al-book { text-align: center; perspective: 1300px; line-height: 1.35; }
      .al-title {
        font-family: var(--hand);
        font-size: 22px;
        color: #d9c298;
        margin-bottom: 10px;
        transform: rotate(-1.2deg);
      }
      .al-spread {
        display: flex;
        align-items: stretch;
        width: min(94vw, 720px);
      }
      .al-page {
        flex: 1;
        min-width: 0;
        display: grid;
        place-items: center;
        padding: 22px 16px 18px;
        background:
          linear-gradient(rgba(242, 231, 207, 0.85), rgba(231, 216, 184, 0.85)),
          url('assets/textures/paper-aged-cream.jpg') repeat;
        background-blend-mode: normal, multiply;
        background-size: auto, 420px;
        border: 1px solid rgba(43, 33, 24, 0.55);
        box-shadow: inset 0 0 28px rgba(102, 78, 48, 0.22), 0 12px 32px rgba(0, 0, 0, 0.55);
      }
      .al-left { border-radius: 7px 2px 2px 7px; transform: rotate(-0.35deg); }
      .al-right { border-radius: 2px 7px 7px 2px; transform: rotate(0.3deg); }
      .al-spine {
        width: 16px;
        margin: 3px -3px;
        z-index: 1;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0));
      }
      .al-spread.al-turn-r { animation: alTurnR 0.34s ease-out; }
      .al-spread.al-turn-l { animation: alTurnL 0.34s ease-out; }
      .al-spread.al-settle { animation: alSettle 0.3s ease-out; }
      @keyframes alTurnR {
        from { transform: rotateY(-12deg); opacity: 0.3; }
        to { transform: none; opacity: 1; }
      }
      @keyframes alTurnL {
        from { transform: rotateY(12deg); opacity: 0.3; }
        to { transform: none; opacity: 1; }
      }
      @keyframes alSettle {
        from { transform: translateY(12px) scale(0.97); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .al-spread { animation: none !important; }
      }
      .al-photo {
        position: relative;
        margin: 0;
        width: min(258px, 38vw);
        padding: 8px 8px 4px;
        background: #faf6ea;
        box-shadow: 0 2px 3px rgba(20, 14, 8, 0.35), 0 9px 20px rgba(20, 14, 8, 0.3);
        transform: rotate(var(--tilt, -2deg));
      }
      .al-photo canvas { display: block; width: 100%; height: auto; }
      .al-print { min-height: 40px; background: #efe6d2; }
      .al-cap {
        font-family: var(--hand);
        font-size: 16.5px;
        line-height: 1.12;
        color: #4c3a28;
        padding: 7px 3px 4px;
        transform: rotate(-0.5deg);
      }
      .al-stamp {
        position: absolute;
        right: -11px;
        bottom: -11px;
        padding: 2px 8px 1px;
        font-family: var(--display);
        font-size: 9.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        white-space: nowrap;
        color: #a3542f;
        border: 1.5px solid rgba(163, 84, 47, 0.6);
        border-radius: 3px;
        background: rgba(250, 246, 234, 0.9);
        transform: rotate(-4deg);
      }
      .al-tape {
        position: absolute;
        width: 42px;
        height: 13px;
        background: rgba(226, 208, 168, 0.78);
        box-shadow: 0 1px 2px rgba(20, 14, 8, 0.2);
      }
      .al-tl { top: -6px; left: 14px; transform: rotate(-5deg); }
      .al-tr { top: -6px; right: 14px; transform: rotate(4deg); }
      /* The one we did not take: mounting corners around honest blank card. */
      .al-missing { background: transparent; box-shadow: none; }
      .al-empty {
        aspect-ratio: 240 / 170;
        border: 1.5px dashed rgba(43, 33, 24, 0.28);
        background: rgba(43, 33, 24, 0.045);
      }
      .al-corner {
        position: absolute;
        width: 0;
        height: 0;
        border: 12px solid transparent;
      }
      .al-corner.c1 { top: 4px; left: 4px; border-top-color: rgba(58, 44, 30, 0.5); border-left-color: rgba(58, 44, 30, 0.5); }
      .al-corner.c2 { top: 4px; right: 4px; border-top-color: rgba(58, 44, 30, 0.5); border-right-color: rgba(58, 44, 30, 0.5); }
      .al-corner.c3 { bottom: 4px; left: 4px; border-bottom-color: rgba(58, 44, 30, 0.5); border-left-color: rgba(58, 44, 30, 0.5); }
      .al-corner.c4 { bottom: 4px; right: 4px; border-bottom-color: rgba(58, 44, 30, 0.5); border-right-color: rgba(58, 44, 30, 0.5); }
      .al-ghost { opacity: 0.55; }
      .al-dots { margin-top: 16px; display: flex; gap: 7px; justify-content: center; }
      .al-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(217, 194, 152, 0.3);
      }
      .al-dot.on { background: rgba(217, 194, 152, 0.95); }
      .al-hint { margin-top: 8px; font-size: var(--fs-115); color: #a58e68; }

      /* ---- the closing book: the journal's own last spreads, once ---- */
      .end-leaf {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        padding: 28px 32px 24px;
        border-radius: 6px;
        text-align: left;
        min-height: min(58vh, 372px);
        min-height: min(58dvh, 372px);
        color: #3a2c1e;
        transform: rotate(-0.25deg);
        background:
          linear-gradient(rgba(242, 231, 207, 0.9), rgba(231, 216, 184, 0.9)),
          url('assets/textures/paper-aged-cream.jpg') repeat;
        background-blend-mode: normal, multiply;
        background-size: auto, 420px;
        border: 1px solid rgba(43, 33, 24, 0.55);
        box-shadow: inset 0 0 28px rgba(102, 78, 48, 0.22), 0 12px 32px rgba(0, 0, 0, 0.55);
      }
      .end-kicker {
        font-family: var(--hand);
        font-size: 19px;
        color: #8a6a3c;
        margin-bottom: 10px;
      }
      /* Kicker at the top, the note at the foot, the page's one thing between
         them, so all four leaves are the same shape as they turn. */
      .end-ruled, .end-plate, .end-creed, .end-route {
        margin-top: auto;
        margin-bottom: auto;
      }
      .end-ruled {
        border-top: 1px solid rgba(90, 70, 45, 0.3);
        border-bottom: 1px solid rgba(90, 70, 45, 0.3);
        padding: 30px 6px;
      }
      .end-written {
        font-family: var(--hand);
        font-size: clamp(22px, 3.4vw, 32px);
        line-height: 1.25;
        color: #2c2740;
        text-align: center;
        margin: 0;
      }
      .end-note {
        font-size: var(--fs-135);
        line-height: 1.55;
        color: #57452f;
        margin: 0;
      }
      .end-route {
        list-style: none;
        padding: 0;
        columns: 2;
        column-gap: 28px;
      }
      .end-stop {
        font-family: var(--display);
        font-size: 15px;
        padding: 2.5px 0;
        color: #7a6850;
        break-inside: avoid;
      }
      .end-num {
        display: inline-block;
        width: 26px;
        font-size: var(--fs-11);
        color: #9a8768;
      }
      .end-inked {
        color: #2f2418;
        text-decoration: line-through;
        text-decoration-color: rgba(70, 52, 32, 0.7);
      }
      .end-last { font-weight: 600; }
      .end-plate { width: 100%; margin-left: 0; margin-right: 0; }
      .end-art { width: min(292px, 62%); margin: 0 auto; }
      .end-art canvas {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid rgba(43, 33, 24, 0.45);
        box-shadow: 0 3px 10px rgba(31, 22, 12, 0.3);
      }
      .end-cap {
        font-family: var(--hand);
        font-size: 16px;
        color: #57452f;
        margin-top: 7px;
        text-align: center;
      }
      .end-creed {
        font-family: var(--hand);
        font-size: clamp(20px, 2.8vw, 27px);
        line-height: 1.4;
        color: #2c2740;
        text-align: center;
      }
      .end-thanks {
        font-family: var(--display);
        font-size: 16px;
        color: #3a2c1e;
        margin: 12px 0 0;
      }
      .end-backleaf { font-family: var(--hand); color: #57452f; text-align: left; }
      .end-hand { font-size: 19px; line-height: 1.35; margin: 0 0 10px; }
      .end-sign { font-size: 19px; text-align: right; color: #8a6a3c; margin: 0; }
      .end-envoi { font-size: var(--fs-135); line-height: 1.55; color: #3a2c1e; margin: 0 0 8px; }
      .end-last-word { font-family: var(--hand); font-size: 17px; color: #57452f; }

      /* ---- journal ephemera: clippings taped in beside Nani's notes ---- */
      .j-eph {
        float: right;
        width: 112px;
        margin: 6px 0 6px 12px;
        padding: 5px 5px 2px;
        position: relative;
        background: #faf5e8;
        border: 1px solid rgba(43, 33, 24, 0.25);
        box-shadow: 0 2px 6px rgba(31, 22, 12, 0.22);
        transform: rotate(2.2deg);
      }
      .j-eph::before, .j-eph::after {
        content: '';
        position: absolute;
        width: 34px;
        height: 11px;
        background: rgba(222, 205, 165, 0.75);
        box-shadow: 0 1px 2px rgba(31, 22, 12, 0.15);
      }
      .j-eph::before { top: -6px; left: -9px; transform: rotate(-38deg); }
      .j-eph::after { bottom: -5px; right: -9px; transform: rotate(-40deg); }
      .j-eph img {
        display: block;
        width: 100%;
        aspect-ratio: 1054 / 1600;
        object-fit: cover;
        background: #efe6d2;
      }
      .j-eph-cap {
        font-family: var(--hand);
        font-size: 13.5px;
        line-height: 1.1;
        color: #6a4c2e;
        padding: 4px 1px 2px;
        transform: rotate(-0.6deg);
      }

      /* ---- reduce motion: calm is also a setting ---- */
      body.reduce-motion * { animation: none !important; transition: none !important; }
      /* Pseudo-elements are not matched by *; without this the title stars
       * kept drifting and the quill dot kept breathing in calm mode. */
      body.reduce-motion *::before,
      body.reduce-motion *::after { animation: none !important; transition: none !important; }
      /* The sweep gradient would sit frozen mid-run without its animation. */
      body.reduce-motion .j-item.j-new { background-image: none; }
      /* And an OS-level preference: every flourish added for delight is
       * optional, so the reduced-motion world simply has things appear. */
      @media (prefers-reduced-motion: reduce) {
        .j-item.j-new { background-image: none; }
        .toast.jt.in,
        .toast.jt.in::before,
        .j-item.j-new,
        .j-thread-rule.draw,
        #tb-portrait.settle,
        #tb-portrait.hop,
        .tb-choice.in,
        .tb-choice.pick,
        .t-arr,
        .cv-ribbon.shimmer::after {
          animation: none !important;
        }
        .toast.jt.in::before { transform: scale(1); }
        #plate, #plate.show {
          transition: opacity 1.1s ease;
          letter-spacing: 0.34em;
        }
      }

      /* ---- chapter mini-games (roots created by the engine) ---- */
      .mg-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.55);
        backdrop-filter: blur(3px);
      }
      .mg-overlay[hidden] { display: none; }

      /* ---- the how-to card & the in-panel pause strip ---- */
      .ht-veil {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.62);
        z-index: 40;
      }
      .ht-veil[hidden] { display: none; }
      /* The card's "more below" cue: only glass can need it (see the coarse
       * tiers), so a desk never lays it out at all. */
      .ht-more { display: none; }
      .ht-card {
        width: min(78%, 440px);
        background:
          linear-gradient(rgba(244, 234, 214, 0.82), rgba(244, 234, 214, 0.82)),
          url('assets/textures/paper-aged-cream.jpg') repeat,
          linear-gradient(120deg, var(--paper), var(--paper-dark));
        background-blend-mode: normal, multiply, normal;
        background-size: auto, 480px, auto;
        border: 2px solid var(--ink);
        border-radius: 4px;
        box-shadow: var(--shadow-card);
        color: var(--ink);
        padding: 18px 22px 16px;
        line-height: 1.45;
        animation: bookOpen 0.2s ease-out;
      }
      @media (prefers-reduced-motion: reduce) { .ht-card { animation: none !important; } }
      .ht-kicker {
        font-family: var(--hand);
        font-size: 16px;
        color: #6b5334;
        transform: rotate(-1deg);
        margin-bottom: 2px;
      }
      .ht-title {
        font-family: var(--display);
        font-weight: 600;
        font-size: 23px;
        letter-spacing: 0.01em;
        margin-bottom: 8px;
      }
      .ht-replay {
        font-family: var(--hand);
        font-size: 17px;
        color: var(--terracotta);
        margin: -2px 0 8px;
        transform: rotate(-0.5deg);
      }
      .ht-coach {
        font-family: var(--hand);
        font-size: 17px;
        color: #8a4a2b;
        background: rgba(217, 164, 65, 0.14);
        border-left: 3px solid var(--gold);
        border-radius: 3px;
        padding: 5px 8px 6px;
        margin: 0 0 9px;
        transform: rotate(-0.4deg);
      }
      .ht-hard {
        font-size: var(--fs-125);
        font-style: italic;
        color: #7a5a33;
        margin: -2px 0 8px;
      }
      .ht-lines {
        border-top: 1.5px solid rgba(43, 33, 24, 0.28);
        padding-top: 9px;
        margin-bottom: 10px;
      }
      .ht-line {
        font-size: var(--fs-15);
        color: var(--ink-soft);
        margin: 4px 0;
        padding-left: 14px;
        position: relative;
      }
      .ht-line::before {
        content: '·';
        position: absolute;
        left: 2px;
        color: var(--gold);
        font-weight: 700;
      }
      .ht-opts { margin-top: 6px; }
      .ht-opt {
        font-family: var(--display);
        font-size: 17px;
        padding: 3px 4px;
        color: #6b5637;
        cursor: pointer;
      }
      .ht-opt.sel { color: var(--ink); font-weight: 600; }
      .ht-keys {
        margin-top: 10px;
        font-size: var(--fs-125);
        font-style: italic;
        color: #5d4b35;
      }
      .ht-strip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: start center;
        z-index: 50;
        pointer-events: none;
      }
      .ht-strip[hidden] { display: none; }
      .ht-strip-card {
        margin-top: 8%;
        display: flex;
        gap: 4px;
        padding: 7px 9px;
        background:
          linear-gradient(rgba(244, 234, 214, 0.9), rgba(244, 234, 214, 0.9)),
          linear-gradient(120deg, var(--paper), var(--paper-dark));
        border: 1.5px solid var(--ink);
        border-radius: 6px;
        box-shadow: var(--shadow-card);
        pointer-events: auto;
      }
      .ht-row {
        font-family: var(--display);
        font-size: var(--fs-15);
        padding: 4px 12px;
        border-radius: 4px;
        color: #6b5637;
        cursor: pointer;
        white-space: nowrap;
      }
      .ht-row.sel { color: var(--ink); font-weight: 600; background: rgba(200, 165, 91, 0.22); }

      .c-track {
        position: relative;
        height: 44px;
        margin: 6px 4px 8px;
        border: 2px solid var(--ink);
        border-radius: 22px;
        background: linear-gradient(#7fb3c4, #4e8fa6);
        overflow: hidden;
      }
      .c-zone {
        position: absolute;
        left: 4%;
        width: 20%;
        top: 0;
        bottom: 0;
        background: rgba(242, 230, 208, 0.28);
        border-right: 2px dashed rgba(242, 230, 208, 0.7);
      }
      .c-zone.wide { left: 30%; width: 40%; border-left: 2px dashed rgba(242,230,208,0.7); }
      .c-horse, .c-rider {
        position: absolute;
        top: 50%;
        width: 20px;
        height: 20px;
        border-radius: 50% 50% 40% 40%;
        background: #d0b276;
        border: 2px solid var(--ink);
        transform: translate(-50%, -50%);
      }
      .c-horse { left: 12%; }
      .c-wave {
        position: absolute;
        top: -4px;
        bottom: -4px;
        width: 16px;
        border-radius: 8px;
        background: linear-gradient(#f2fbff, #8fcbe8);
        border: 2px solid rgba(43, 33, 24, 0.55);
      }
      .c-count { font-size: var(--fs-13); letter-spacing: 0.3em; margin-bottom: 6px; color: #57452f; }
      .n-grid { display: grid; gap: 3px; margin: 8px 2px 10px; }
      .n-cell {
        aspect-ratio: 1;
        border: 1.6px solid rgba(60, 110, 110, 0.8);
        border-radius: 2px;
        background: rgba(60, 110, 110, 0.12);
      }
      .n-cell.hole { background: rgba(23, 18, 14, 0.5); border-style: dashed; }
      .n-cell.cur { outline: 3px solid #c1512f; outline-offset: -1px; }

      /* ---- door-transition fade ---- */
      #fade {
        position: absolute;
        inset: 0;
        background: #17120e;
        opacity: 0;
        pointer-events: none;
      }

      /* ---- the iris wipe: a hole in the dark, closing and opening ---- */
      #iris {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 0;
        height: 0;
        border-radius: 50%;
        pointer-events: none;
        display: none;
      }

      /* ---- the journey card: a held breath between regions ---- */
      #journeycard {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.55s ease;
        color: #e8dcc4;
      }
      #journeycard.show { opacity: 1; }
      #journeycard .jc-stamp {
        display: inline-block;
        padding: 18px 34px 16px;
        border: 2.5px solid rgba(200, 120, 80, 0.8);
        outline: 1.5px solid rgba(200, 120, 80, 0.55);
        outline-offset: 4px;
        border-radius: 10px;
        transform: rotate(-3deg) scale(1.25);
        opacity: 0;
        transition: transform 0.35s cubic-bezier(0.2, 1.6, 0.4, 1), opacity 0.3s ease;
        color: #d9926a;
      }
      #journeycard.show .jc-stamp { transform: rotate(-3deg) scale(1); opacity: 1; }
      @media (prefers-reduced-motion: reduce) {
        #journeycard .jc-stamp { transition: opacity 0.3s ease; transform: rotate(-3deg); }
      }
      .jc-name {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(24px, 4vw, 40px);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .jc-rule {
        width: 120px;
        height: 3px;
        margin: 14px auto 12px;
        border-radius: 2px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 12px, #d9a441 12px 24px, #3f7fb0 24px 36px, #6b8e4e 36px 48px
        );
        opacity: 0.85;
      }
      .jc-hop { font-family: var(--hand); font-size: 22px; color: #cbb794; margin-top: 16px; }

      /* ---- debug ---- */
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 9px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #c8a55b;
        background: #17120ecc;
        border: 1px solid #2b2118;
        white-space: pre;
        pointer-events: none;
        display: none;
      }
      #debug[data-on='1'] { display: block; }

      /* ================= the pocket edition: phones in the hand ============
       * The desktop page is the reference print and must not move: every rule
       * below lives behind a media query that can never match at widths of
       * 1100px and up (or, for touch niceties, behind a coarse pointer that
       * desktop mice never present). Same pages, refolded for a pocket. */

      /* Touch niceties, any size: no double-tap zoom fighting the taps, no
       * blue flash on the paper. Mouse and keyboard never feel these. */
      @media (pointer: coarse) {
        html, body { touch-action: manipulation; }
        #hud, #title, #letter, #journal, #pause, #weave, .mg-overlay {
          -webkit-tap-highlight-color: transparent;
        }
        /* A held tap must never start selecting dialogue text or summon the
         * copy magnifier; nothing in the game is meant to be selected. */
        #stage {
          -webkit-user-select: none;
          user-select: none;
          -webkit-touch-callout: none;
        }
      }

      /* A short desktop window (a 1366x657 laptop browser, 1100x700): the
       * cover tightens and, past that, scrolls rather than cutting Credits
       * off. Fine pointers only; phones and tablets have their own tiers. */
      @media (pointer: fine) and (max-height: 820px) {
        #title {
          display: flex;
          flex-direction: column;
          align-items: center;
          overflow-y: auto;
          padding: 12px 0;
        }
        #title[hidden] { display: none; }
        .t-card { margin: auto; }
      }

      /* Phone-wide landscape: a short room, the same furniture, lower. */
      @media (max-width: 1099.98px) and (max-height: 520px) {
        .j-book { width: min(92vw, 760px); height: calc(100% - 14px); max-height: none; box-sizing: border-box; }
        #title, #letter, #chapterclose, #cc-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          overflow-y: auto;
          padding: 10px 0;
        }
        #title[hidden], #letter[hidden], #chapterclose[hidden], #cc-card[hidden] { display: none; }
        .t-card, .letter-fold, .cx-card, .cc-paper { margin: auto; }
        .cx-card { max-height: none; }
        /* Lying down, a phone's home indicator sits along this edge. */
        #textbox { bottom: calc(8px + env(safe-area-inset-bottom)); }
      }

      /* The phone tier proper. */
      @media (max-width: 700px) {
        /* ---- ambient HUD: one column of bands under the notch ----
         * Desktop spreads plate, chip, and toasts across a wide top edge; a
         * phone has one narrow one, so they stack: nameplate, then the errand
         * chip, then whispers, each in its own band, nothing overprinting. */
        #plate {
          top: calc(8px + env(safe-area-inset-top));
          max-width: calc(100vw - 24px);
          box-sizing: border-box;
          padding: 7px 16px 6px 20px;
          font-size: 12px;
          letter-spacing: 0.3em;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #plate.show { letter-spacing: 0.22em; }
        #errand {
          top: calc(52px + env(safe-area-inset-top));
          left: calc(10px + env(safe-area-inset-left));
          right: calc(10px + env(safe-area-inset-right));
          max-width: none;
        }
        #toasts {
          top: calc(148px + env(safe-area-inset-top));
          right: calc(10px + env(safe-area-inset-right));
          left: calc(10px + env(safe-area-inset-left));
        }
        #toasts { max-width: none; }
        .toast { max-width: 100%; box-sizing: border-box; }
        .toast.wh { max-width: min(100%, 380px); }

        /* ---- the dialogue box: full width, riding the home bar ---- */
        #textbox {
          width: calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right));
          box-sizing: border-box;
          bottom: calc(10px + env(safe-area-inset-bottom));
          gap: 10px;
          padding: 10px 10px 8px;
        }
        #tb-portrait { margin-top: 6px; }
        #tb-portrait canvas { width: 48px; height: 48px; }
        #tb-text { min-height: 44px; }
        /* Choice rows grow to finger height without changing their look. */
        .tb-choice { padding-top: 8px; padding-bottom: 8px; }

        /* ---- the journal: near-fullscreen book, tabs that scroll ---- */
        .j-book {
          width: calc(100vw - 16px - env(safe-area-inset-left) - env(safe-area-inset-right));
          height: calc(100% - 14px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
          box-sizing: border-box;
          max-width: none;
          max-height: none;
          padding: 12px 12px 8px;
        }
        .j-tabs {
          overflow-x: auto;
          overscroll-behavior-x: contain;
          margin: 8px -12px 10px;
          padding: 0 12px;
          scrollbar-width: none;
        }
        .j-tabs::-webkit-scrollbar { display: none; }
        /* A strip wider than the glass fades where it goes on, so the
         * hidden tabs read as there, a thumb-swipe away. */
        .j-tabrow::before, .j-tabrow::after {
          content: '';
          position: absolute;
          top: 0;
          bottom: 2px;
          width: 34px;
          pointer-events: none;
          opacity: 0;
          transition: opacity 0.2s;
          z-index: 1;
        }
        .j-tabrow::before { left: -10px; background: linear-gradient(90deg, #ece0c8, rgba(236, 224, 200, 0)); }
        .j-tabrow::after { right: -10px; background: linear-gradient(270deg, #ece0c8, rgba(236, 224, 200, 0)); }
        .j-tabrow.more-l::before, .j-tabrow.more-r::after { opacity: 1; }
        .j-tab { flex: 0 0 auto; padding: 8px 13px 7px; }
        /* One column: the page list above, the open page below. */
        .j-body { flex-direction: column; gap: 8px; }
        .j-list { flex: 0 0 auto; max-height: 32%; }
        .j-item { padding: 6px 6px; }
        .j-detail {
          border-left: none;
          padding-left: 2px;
          border-top: 1px solid rgba(43, 33, 24, 0.25);
          padding-top: 8px;
        }
        .j-ph-grid { flex: 0 0 auto; max-height: 44%; }
        .j-task { padding-top: 10px; padding-bottom: 10px; }
        /* The task page reads top to bottom in a hand: now, then crossed
         * off, then the folded places. */
        .jt { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto 1fr; }
        .jt-herecol { border-left: none; padding-left: 0; border-top: 1px dashed rgba(107, 83, 52, 0.35); padding-top: 10px; }
        .jt-now { font-size: 17px; }
        .jt-leaf summary { min-height: 40px; align-items: center; }
        .j-eph { width: 90px; margin: 4px 0 4px 10px; }

        /* ---- overlays taller than a phone: center small, scroll tall ---- */
        #title, #letter, #chapterclose, #cc-card {
          display: flex;
          flex-direction: column;
          align-items: center;
          overflow-y: auto;
          padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
        }
        #title[hidden], #letter[hidden], #chapterclose[hidden], #cc-card[hidden] { display: none; }
        .t-card, .letter-fold, .cx-card, .cc-paper { margin: auto; }

        /* ---- the cover, the shelf, the letter, the flyleaf ---- */
        .t-card { padding: 0 12px; }
        .t-controls { padding: 0 6px; }
        .letter-fold { width: min(100vw - 24px, 538px); }
        .letter-paper { padding: 25px 22px 6px; }
        .cx-card { width: min(100vw - 24px, 440px); box-sizing: border-box; padding: 20px 18px 12px; max-height: none; }
        .cc-paper { width: min(100vw - 24px, 430px); box-sizing: border-box; padding: 22px 20px 14px; }
        .cc-input { width: 80%; }

        /* ---- paper panels that must fit a narrow page ---- */
        .w-panel { width: min(100vw - 16px, 700px); box-sizing: border-box; padding: 12px 10px 10px; }
        .g-stage canvas { max-width: 100%; height: auto !important; }
        .ht-card { width: min(100vw - 24px, 440px); box-sizing: border-box; }
        .p-card { width: min(100vw - 24px, 460px); box-sizing: border-box; padding: 16px 18px 18px; }
        .al-spread { width: calc(100vw - 12px); }
        .al-page { padding: 14px 8px 12px; }
      }

      /* ---- touch tap comfort: last word on row heights ----
       * After the size tiers above so a finger always gets the taller row.
       * Coarse-gated: desktop mice never match, whatever the window size. */
      @media (pointer: coarse) {
        .t-opt { padding: 5px 0; }
        .p-opt { padding: 6px 0; }
        .p-row { padding-top: 8px; padding-bottom: 8px; }
        .j-tab { padding-top: 12px; padding-bottom: 12px; }
        .j-item { padding-top: 8px; padding-bottom: 8px; }
        .ht-opt { padding: 10px 4px; }
        .ht-row { padding: 10px 12px; }
        .sh-verb { padding-top: 6px; padding-bottom: 6px; }
        /* Every finger target reaches 44px. Dialogue choices keep their
         * margin-list look and simply gain height; the flyleaf's look
         * arrows get whole 44px cells instead of a glyph-sized sliver. */
        .tb-choice { padding-top: 11px; padding-bottom: 11px; }
        .cc-row { grid-template-columns: 44px 1fr 44px; }
        .cc-arr {
          min-height: 44px;
          padding: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .cc-btn { min-height: 44px; }
        /* A swatch is a finger target too: big enough to land on, with the
         * row itself tall enough to hold a whole fingertip. */
        .cc-dots { gap: 10px; }
        .cc-dot { width: 24px; height: 24px; }
        .cc-mid { min-height: 44px; }
        /* The chip's quiet last line is small print under small print;
         * held in a hand it keeps a legible floor. */
        .errand-nudge { font-size: max(0.85em, 12.5px); }
      }

      /* ---- readable floor for small touch screens ----
       * The small-print tier was sized for a desk. On a phone in the hand it
       * floors near 13.5px. Set on :root, so the Large text setting (vars on
       * body.text-large, closer to the text) still wins when chosen. */
      /* Phones held sideways are 844 to 932px wide and slip past a width
       * gate, so the floor also keys off the short side a phone lying down
       * always has. Tablets are taller than 500px either way. */
      @media (pointer: coarse) and (max-width: 740px), (pointer: coarse) and (max-height: 500px) {
        :root {
          --fs-11: 13px;
          --fs-115: 13px;
          --fs-12: 13.5px;
          --fs-125: 13.5px;
          --fs-13: 14px;
          --fs-135: 14.5px;
          --fs-14: 15px;
          --fs-145: 15.5px;
          --fs-15: 16px;
          --fs-body: 17.5px;
          --fs-hand16: 17.5px;
          --fs-hand17: 18.5px;
          --fs-hand175: 19px;
          --fs-label: 12px;
        }
      }

      /* ---- landscape phones: minigame panels fit a short room ----
       * The paper panel was taller than a phone lying down (its 640px scene
       * plus title and hint). Cap the scene by the room's height, keep the
       * panel clear of the touch pad in the corners, and let anything left
       * over scroll. Coarse-gated: a short desktop window never changes. */
      /* A short landscape screen: Nani's letter is widened and written a
       * little smaller, rules and all, so the whole sheet and the line
       * under it ("tap to put the letter down") fit without scrolling. At
       * 412px tall the hint used to sit below the fold. */
      @media (max-height: 520px) and (orientation: landscape) {
        .letter-fold { width: min(100vw - 24px, 680px); max-width: none; }
        /* The sheet's own 470px cap kept it at the old width inside the
         * widened fold, so it hung off-center to the left. */
        .letter-fold .letter-paper { max-width: none; }
        /* Rule at 10 + 22 = 32px, one under the 31px baseline (17px on 23px). */
        .letter-paper { padding: 14px 26px 4px; background-position: 0 10px, 0 0, 0 0; }
        .letter-paper {
          background-image:
            repeating-linear-gradient(180deg, transparent 0 22px, rgba(122, 90, 58, 0.14) 22px 23px),
            url('assets/textures/paper-grain-white.jpg'),
            linear-gradient(#f4ead6, #e9dabb);
        }
        .letter-body { font-size: 17px; line-height: 23px; }
        .letter-body p { margin: 0 0 23px; }
        .letter-sign { margin: 0; }
        .letter-hint { padding-top: 2px; padding-bottom: 2px; }
      }
      @media (pointer: coarse) and (max-height: 500px) {
        .w-panel {
          width: min(96vw, 700px);
          max-width: calc(100vw - 2 * (152px + env(safe-area-inset-left, 0px)));
          max-height: calc(100vh - 8px);
          max-height: calc(100dvh - 8px);
          box-sizing: border-box;
          overflow-y: auto;
          padding: 8px 12px 8px;
        }
        .g-stage { margin: 6px 0 4px; }
        .g-stage canvas {
          width: auto !important;
          height: auto !important;
          max-width: 100%;
          max-height: min(62vh, 400px);
          max-height: min(62dvh, 400px);
        }
        .w-title { margin-bottom: 4px; }
        .w-hint { margin-bottom: 4px; }
        /* The key legend is desk furniture; the pad and taps replace it. */
        .w-legend { display: none; }
        .ht-strip-card { margin-top: 2%; }
        .p-card {
          max-height: calc(100vh - 10px);
          max-height: calc(100dvh - 10px);
          overflow-y: auto;
          box-sizing: border-box;
        }
        /* The how-to card holds still and its body scrolls: the foot (the
         * hint, the "more below" pill) stays on the page under the text. */
        .ht-card {
          max-height: calc(100vh - 10px);
          max-height: calc(100dvh - 10px);
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }
        .ht-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
        /* A scene capped by height is narrower than its panel: sit it in
         * the middle rather than against the left rule. */
        .g-stage canvas { margin: 0 auto; }
        /* The caps above follow the visible room (dvh: a phone's toolbar
         * takes from 100vh). Should a card still outgrow it, it hangs from
         * the top, where it scrolls, rather than off both edges at once. */
        #pause, #weave, .mg-overlay, .ht-veil { place-items: safe center; }
      }

      /* ---- landscape phones: Settings opens wide ----
       * A phone lying down is 393 to 412px tall. (The cover is an open
       * book at every size now; its own short tier sits with it.) Settings
       * takes a spread and sets its
       * rows in two columns, so the last row and its hint stay on the page
       * (a clipped row let a finger fall through to the backdrop, which
       * reads as Back). Coarse-gated and short: desktop windows never match. */
      @media (pointer: coarse) and (max-height: 500px) and (orientation: landscape) {
        #title { padding: 8px 0; }
        .t-card { padding: 0 12px; }

        .p-card:has(.p-settings) {
          width: min(94vw, 720px);
          max-width: calc(100vw - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
          padding: 12px 22px 12px;
        }
        .p-card:has(.p-settings) .p-title { margin-bottom: 6px; }
        .p-settings {
          display: grid;
          grid-template-columns: 1fr 1fr;
          column-gap: 30px;
        }
        .p-settings .p-row { min-height: 44px; box-sizing: border-box; align-items: center; padding-top: 4px; padding-bottom: 4px; }
        .p-settings .p-hint-line { grid-column: 1 / -1; margin-top: 6px; }

        /* The flyleaf's traveler stands in the left margin, the choices
         * beside it, so "set out" is on the page without a scroll. */
        .cc-paper:has(.cc-fig) {
          width: min(94vw, 640px);
          box-sizing: border-box;
          padding: 12px 28px 10px;
          display: grid;
          grid-template-columns: 150px 1fr;
          /* The hint sits under the traveler, level with "set out": stacked
           * below the button it ran 30px past a 340px-tall iPhone and the
           * page bottom fell off the screen. */
          grid-template-areas:
            'kicker kicker'
            'fig copy'
            'fig rows'
            'hint actions';
          column-gap: 18px;
        }
        .cc-paper:has(.cc-fig) .cc-kicker { grid-area: kicker; margin-bottom: 4px; }
        .cc-paper:has(.cc-fig) .cc-copy { grid-area: copy; margin: 0 auto 4px; }
        .cc-paper:has(.cc-fig) .cc-fig { grid-area: fig; align-self: center; margin: 0; }
        .cc-paper:has(.cc-fig) .cc-rows { grid-area: rows; width: 100%; margin: 0 auto 2px; }
        .cc-paper:has(.cc-fig) .cc-actions { grid-area: actions; }
        .cc-paper:has(.cc-fig) .cc-hint { grid-area: hint; align-self: center; padding-top: 0; }
      }

      /* ---- the HUD in the hand ----
       * Glass keeps the chip short once it has been read: a new thread reads
       * in full for a few seconds (the `fresh` class, see ChipFold in
       * responsive.ts), then folds so the world keeps the room. It folds to
       * two lines, not one: one line cut every clue before its place ("by
       * the house with the red fla..."). A small fold mark says a tap opens
       * it again (the chip takes taps on glass; main.ts). */
      @media (pointer: coarse) and (max-height: 500px), (pointer: coarse) and (max-width: 700px) {
        #errand { pointer-events: auto; cursor: pointer; }
        body.quiet-hud #errand { pointer-events: none; }
        /* The bottom padding becomes a transparent border: a clamped box
         * clips at its padding edge, so real padding let the top of the
         * third line peek out under the second. */
        #errand:not(.fresh) {
          -webkit-line-clamp: 2;
          padding-right: 26px;
          padding-bottom: 0;
          border-bottom: 6px solid transparent;
          box-shadow: 0 1px 0 rgba(200, 165, 91, 0.4);
        }
        #errand.nudged:not(.fresh) { -webkit-line-clamp: 3; }
        #errand:not(.fresh)::after {
          content: '\25BE';
          position: absolute;
          right: 9px;
          bottom: 5px;
          font-style: normal;
          font-size: 0.9em;
          color: rgba(217, 164, 65, 0.85);
        }
        #errand:not(.fresh) .errand-nudge { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      }
      /* Lying down, a phone has one short top edge and the pad's button
       * column down the right (226px tall at most, plus the sideways pin
       * above it). The chip takes the left half of the edge, whispers the
       * right half and stop short of the column, and the nameplate, while
       * it shows, takes the middle and nudges both one band lower. */
      @media (pointer: coarse) and (max-height: 500px) and (orientation: landscape) {
        #plate {
          top: calc(6px + env(safe-area-inset-top));
          max-width: calc(100vw - 200px);
          box-sizing: border-box;
          padding: 7px 16px 6px 20px;
          font-size: 12px;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        #errand {
          top: calc(6px + env(safe-area-inset-top));
          left: calc(10px + env(safe-area-inset-left));
          right: auto;
          max-width: calc(50vw - 22px - env(safe-area-inset-left));
          box-sizing: border-box;
          transition: opacity 0.25s ease, top 0.35s ease;
        }
        #toasts {
          top: calc(6px + env(safe-area-inset-top));
          left: calc(50vw + 8px);
          right: calc(92px + env(safe-area-inset-right));
          max-width: none;
          transition: opacity 0.25s ease, top 0.35s ease;
        }
        .toast, .toast.wh { max-width: 100%; box-sizing: border-box; }
        #plate.show ~ #toasts {
          top: calc(46px + env(safe-area-inset-top));
          transition: opacity 0.25s ease, top 0.35s ease;
        }
        /* Back up only once the nameplate has finished fading (1.1s): the
         * chip used to rise into a plate still half visible and sit under it. */
        #errand, #toasts { transition: opacity 0.25s ease, top 0.35s ease 1.1s; }

        /* The how-to card opens as a spread: the telling on the left leaf,
         * the hard telling and the choices on the right, so Begin and Not
         * yet sit on the page instead of a scroll below it. */
        .ht-card {
          width: min(94vw, 760px);
          max-width: calc(100vw - 16px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
          padding: 14px 20px 10px;
        }
        .ht-body {
          display: flex;
          align-items: flex-start;
          gap: 20px;
        }
        .ht-main { flex: 1.2 1 0; min-width: 0; }
        .ht-side {
          flex: 1 1 0;
          min-width: 0;
          align-self: stretch;
          display: flex;
          flex-direction: column;
          justify-content: center;
          padding-left: 18px;
          border-left: 1.5px solid rgba(43, 33, 24, 0.18);
        }
        .ht-title { font-size: 21px; margin-bottom: 6px; }
        .ht-lines { margin-bottom: 0; }
        .ht-side .ht-hard { margin: 0 0 8px; }
        .ht-side .ht-opts { margin-top: 0; }

        #title { padding: 6px 0; }
      }
      /* Any card taller than the glass says so: a pill at its foot while
       * there is more below, and a tap on it brings the rest up. */
      @media (pointer: coarse) {
        .ht-foot {
          flex: 0 0 auto;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 12px;
          margin-top: 8px;
          padding-top: 6px;
          border-top: 1.5px solid rgba(43, 33, 24, 0.14);
        }
        .ht-foot .ht-keys { margin-top: 0; text-align: right; }
        .ht-more {
          display: block;
          flex: 0 0 auto;
          min-height: 32px;
          box-sizing: border-box;
          padding: 5px 16px 4px;
          font-family: var(--hand);
          font-size: 18px;
          line-height: 1.2;
          color: var(--paper);
          background: rgba(43, 33, 24, 0.9);
          border-radius: 16px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s ease;
        }
        .ht-more.on { opacity: 1; pointer-events: auto; }
      }

      /* ---- landscape-first: the journal reads best sideways ----
       * Phones upright see a quarter of a page drawn wide, so responsive.ts
       * offers sideways once a session: a card that lays the page sideways
       * where the browser can lock orientation and asks for the turn where
       * it cannot, and a quiet corner pin once the offer is waved off.
       * Upright always stays playable. The elements only ever
       * mount on phones (screen's short side under 600px), and every rule
       * here is coarse-and-hoverless gated besides, so desktop mice and
       * narrow desktop windows can never feel any of it. */
      @media (pointer: coarse) and (hover: none) {
        /* The veil: the offer sits above the HUD. */
        #sideways {
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          padding: 18px;
          box-sizing: border-box;
          background: rgba(23, 18, 14, 0.82);
          backdrop-filter: blur(3px);
          z-index: 190;
        }
        #sideways[hidden], #sidewayspin[hidden] { display: none; }

        /* The card is a journal page like every other surface. */
        .sw-card {
          width: min(84vw, 340px);
          box-sizing: border-box;
          padding: 22px 20px 18px;
          background: linear-gradient(120deg, var(--paper), var(--paper-dark));
          border: 2px solid var(--ink);
          border-radius: 3px;
          box-shadow: var(--shadow-card);
          color: var(--ink);
          text-align: center;
        }
        .sw-title {
          font-family: var(--hand);
          font-size: 26px;
          line-height: 1.15;
          color: #7c2f18;
          transform: rotate(-0.8deg);
          margin-bottom: 8px;
        }
        .sw-line {
          font-size: var(--fs-135);
          font-style: italic;
          line-height: 1.45;
          color: var(--ink-soft);
          margin-bottom: 14px;
        }

        .sw-lock {
          font-size: var(--fs-125);
          line-height: 1.4;
          color: var(--ink-soft);
          border-top: 1px dashed rgba(43, 33, 24, 0.3);
          padding-top: 10px;
          margin-bottom: 6px;
        }

        /* The glyph: a small phone drawn in ink, turning itself sideways.
         * Its resting pose is already turned, so when motion is calmed (the
         * OS preference or the in-game setting) it simply lies on its side. */
        .sw-glyph {
          height: 46px;
          display: grid;
          place-items: center;
          margin-bottom: 8px;
        }
        .sw-phone {
          display: block;
          width: 18px;
          height: 30px;
          border: 2px solid var(--ink);
          border-radius: 4px;
          position: relative;
          transform: rotate(90deg);
          animation: swTurn 2.8s ease-in-out infinite;
        }
        .sw-phone::after {
          content: '';
          position: absolute;
          left: 50%;
          bottom: 2px;
          width: 4px;
          height: 2px;
          margin-left: -2px;
          border-radius: 1px;
          background: var(--terracotta);
        }
        @keyframes swTurn {
          0%, 18% { transform: rotate(0deg); }
          52%, 84% { transform: rotate(90deg); }
          100% { transform: rotate(0deg); }
        }
        @media (prefers-reduced-motion: reduce) {
          .sw-phone { animation: none; }
        }

        /* One big yes, one soft not-now. */
        .sw-go {
          display: block;
          width: 100%;
          padding: 12px 10px;
          box-sizing: border-box;
          background: var(--ink);
          color: var(--paper);
          border: 1px solid var(--ink);
          border-radius: 2px;
          box-shadow: 2px 2px 0 rgba(43, 33, 24, 0.45);
          font-family: var(--display);
          font-weight: 600;
          font-size: 16px;
          letter-spacing: 0.06em;
          cursor: pointer;
        }
        .sw-go:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(43, 33, 24, 0.45); }
        .sw-stay {
          display: block;
          min-height: 44px;
          margin: 8px auto 0;
          padding: 8px 12px;
          background: none;
          border: none;
          font-family: var(--hand);
          font-size: 18px;
          color: #6b5334;
          text-decoration: underline dashed rgba(107, 83, 52, 0.5);
          text-underline-offset: 3px;
          cursor: pointer;
        }

        /* The pin lives in the pad's side column, on top of it, a round
         * button like its neighbours: as a paper scrap floating above the
         * column it sat mid-right of the playfield, and a tap meant to walk
         * east threw the game fullscreen. The column's own quiet (vp-quiet)
         * hides it under paper overlays. */
        #sidewayspin {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2px;
          /* A pill, not a coin: the word says what it does. */
          width: auto;
          min-width: 48px;
          padding: 0 8px;
          border-radius: 24px;
          color: rgba(242, 230, 208, 0.9);
          font-family: 'Literata', Georgia, serif;
          cursor: pointer;
        }
        #sidewayspin .sw-phone-small { border-color: rgba(242, 230, 208, 0.9); }
        .sw-pin-word { font-size: 9.5px; line-height: 1; letter-spacing: 0.02em; white-space: nowrap; }
        .sw-phone-small {
          width: 12px;
          height: 20px;
          border-width: 1.5px;
          border-radius: 3px;
          animation: none;
        }
      }

      /* A chip over the face of someone near the player steps down to the
       * foot of the frame (faceClearHud in main.ts). Last in the sheet, and
       * scoped by #hud, so it outranks every corner rule above, including
       * the landscape phone's plate shove. */
      #hud #errand.face-moved {
        top: auto;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        max-width: min(60vw, 560px);
      }
      @media (max-width: 700px) {
        #hud #errand.face-moved {
          bottom: calc(250px + env(safe-area-inset-bottom));
          left: calc(10px + env(safe-area-inset-left));
          right: calc(10px + env(safe-area-inset-right));
          transform: none;
          max-width: none;
        }
      }
      @media (pointer: coarse) and (max-height: 500px) and (orientation: landscape) {
        #hud #errand.face-moved {
          bottom: calc(10px + env(safe-area-inset-bottom));
          max-width: min(52vw, 480px);
        }
      }

      /* Wide screens: the HUD, the dialogue box and the mini-game panels
       * grow with the frame. At 1920 the chip read at 12px and the kite
       * panel took 740 of 1920 pixels; --ui-k (set by trackUiScale in
       * responsive.ts) is 1 up to 1280x800 and follows the smaller of the
       * two stretches above it, capped, so a 1280 window is unchanged. */
      #plate, #toasts, #errand, #textbox, .mg-overlay, #weave, .ht-veil, .ht-strip { zoom: var(--ui-k, 1); }
      /* Read aloud, never drawn: the dialogue line whole, for screen readers. */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Loading Say Yes to Soup">
      <svg class="ld-bowl" viewBox="0 0 120 104" aria-hidden="true">
        <path class="ld-steam s1" d="M44 44 C 38 34, 50 28, 44 18 S 46 6, 42 0" />
        <path class="ld-steam s2" d="M60 42 C 54 32, 66 26, 60 16 S 62 4, 58 -2" />
        <path class="ld-steam s3" d="M76 44 C 70 34, 82 28, 76 18 S 78 6, 74 0" />
        <ellipse cx="60" cy="96" rx="34" ry="5" fill="rgba(0,0,0,0.35)" />
        <path d="M14 56 H106 C 104 80, 86 94, 60 94 C 34 94, 16 80, 14 56 Z" fill="#a85a36" />
        <path d="M14 56 H106 C 105 66, 101 74, 95 80 C 86 70, 34 70, 25 80 C 19 74, 15 66, 14 56 Z" fill="#8f4a2b" opacity="0.55" />
        <path d="M22 70 H98" stroke="#d9a441" stroke-width="3" stroke-dasharray="7 5" opacity="0.8" />
        <ellipse cx="60" cy="56" rx="46" ry="9" fill="#c9733f" />
        <ellipse cx="60" cy="57" rx="40" ry="6.5" fill="#e0a24a" />
        <ellipse cx="50" cy="56" rx="9" ry="1.8" fill="#f3cf82" opacity="0.8" />
      </svg>
      <div class="ld-band" aria-hidden="true"><i></i></div>
      <div class="ld-lines" aria-hidden="true">
        <span>warming the pot</span>
        <span>finding her pages</span>
        <span>asking about the bread</span>
        <span>saying yes to soup</span>
      </div>
      <p class="ld-slow">A slow road today. If nothing changes soon, a refresh usually helps.</p>
    </div>
    <script>
      // Plain script, ahead of the game's module: if the game never gets far
      // enough to lift this loader (an old browser, a device out of canvas
      // memory, a frame that throws every time), say so here instead of a
      // bowl steaming forever. The game sets window.__soupBooted once a real
      // frame has drawn; it calls window.__soupFail when it gives up itself.
      (function () {
        function fail(why) {
          if (window.__soupBooted) return;
          var p = document.querySelector('#loader .ld-slow');
          if (!p) return;
          // A later, better reason may replace an earlier one.
          p.textContent =
            'The game could not start in this browser' + (why ? ' (' + why + ')' : '') +
            '. Reloading the page often helps, and your journal is kept safe in this browser. ' +
            'If it keeps happening, an up-to-date Chrome, Firefox or Safari should carry it.';
          p.style.animation = 'none';
          p.style.opacity = '1';
          p.style.color = '#e6d7bb';
        }
        window.__soupFail = fail;
        function soon(why) {
          setTimeout(function () { fail(why); }, 3000);
        }
        window.addEventListener('error', function (e) {
          // Only the game's own scripts: an extension's error, or a
          // cross-origin one the browser reduces to "Script error.", says
          // nothing about whether the game is starting.
          var file = e && e.filename ? String(e.filename) : '';
          if (!file || file.indexOf(location.origin) !== 0) return;
          soon(e.message ? String(e.message).slice(0, 220) : '');
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          soon(r ? String((r && r.message) || r).slice(0, 220) : '');
        });
        // Patience is counted only while the page is in view: a tab opened in
        // the background pauses the game's frames, and that is not a failure.
        var waited = 0;
        var tick = setInterval(function () {
          if (window.__soupBooted) return clearInterval(tick);
          if (document.visibilityState === 'visible') waited += 1;
          if (waited >= 45) {
            clearInterval(tick);
            fail('');
          }
        }, 1000);
      })();
    </script>
    <div id="stage">
      <div id="frame">
        <canvas id="game"></canvas>
        <div id="hud">
          <div id="plate"></div>
          <div id="toasts" role="status" aria-live="polite"></div>
          <div id="errand" hidden></div>
          <div id="textbox" hidden>
            <div id="tb-portrait"></div>
            <div id="tb-main">
              <div id="tb-name"></div>
              <div id="tb-text" aria-hidden="true"></div>
              <div id="tb-arrow">&#9662;</div>
              <div id="tb-choices"></div>
            </div>
          </div>
          <div id="journal" hidden></div>
          <div id="weave" hidden></div>
          <div id="pause" hidden></div>
          <div id="album" hidden></div>
          <div id="fade"></div>
          <div id="iris"></div>
          <div id="journeycard"></div>
          <div id="chapterclose" hidden></div>
          <div id="cc-card" hidden></div>
          <div id="letter" hidden></div>
          <div id="title" hidden></div>
        </div>
      </div>
    </div>
    <div id="sr-line" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <pre id="debug"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

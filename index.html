<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Say Yes to Soup</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #2b2118;
        --paper: #f4ead6;
        --paper-dark: #e6d7bb;
        --gold: #c8a55b;
        --terracotta: #c1512f;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #17120e;
        overflow: hidden;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #frame {
        position: relative;
        width: 100vw;
        height: 100vh;
        line-height: 0;
        overflow: hidden;
      }
      /* The Canvas2D world buffer is offscreen; PixiJS presents fullscreen. */
      #game { display: none; }
      #stagegl { display: block; }
      /* Everything layered over the canvas lives here. */
      #hud {
        position: absolute;
        inset: 0;
        line-height: 1.45;
        pointer-events: none;
      }

      /* ---- village nameplate ---- */
      #plate {
        position: absolute;
        top: 7%;
        left: 50%;
        transform: translate(-50%, 6px);
        padding: 8px 24px 7px 28px;
        color: #f2e6d0;
        background: rgba(23, 18, 14, 0.78);
        border: 1px solid rgba(200, 165, 91, 0.35);
        border-radius: 2px;
        font-size: 14px;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 1.1s ease, transform 1.1s ease;
      }
      #plate::before, #plate::after {
        content: '';
        position: absolute;
        top: 50%;
        width: 14px;
        height: 1px;
        background: rgba(200, 165, 91, 0.55);
      }
      #plate::before { left: 8px; }
      #plate::after { right: 8px; }
      #plate.show { opacity: 1; transform: translate(-50%, 0); }

      /* ---- toasts: "a page filled" whispers ---- */
      #toasts {
        position: absolute;
        top: 10px;
        right: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: flex-end;
      }
      .toast {
        padding: 6px 12px;
        background: rgba(244, 234, 214, 0.94);
        color: var(--ink);
        border: 1px solid var(--ink);
        border-radius: 2px;
        box-shadow: 2px 2px 0 rgba(43, 33, 24, 0.45);
        font-size: 13.5px;
        font-style: italic;
        opacity: 0;
        transform: translateX(10px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .toast.in { opacity: 1; transform: translateX(0); }

      /* ---- errand chip ---- */
      #errand {
        position: absolute;
        bottom: 10px;
        right: 10px;
        max-width: 42%;
        padding: 5px 10px;
        background: rgba(23, 18, 14, 0.8);
        color: #e8dcc4;
        border: 1px solid rgba(200, 165, 91, 0.4);
        border-radius: 2px;
        font-size: 12.5px;
        font-style: italic;
      }
      #errand::before { content: '\2709 '; font-style: normal; }

      /* ---- dialogue box ---- */
      #textbox {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: min(92vw, 860px);
        bottom: 18px;
        min-height: 96px;
        display: flex;
        gap: 12px;
        padding: 12px 14px 10px;
        background:
          linear-gradient(rgba(244, 234, 214, 0.97), rgba(236, 223, 197, 0.97));
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: 3px 3px 0 rgba(43, 33, 24, 0.5);
        color: var(--ink);
      }
      /* Woven trim along the top, from the locked palette. */
      #textbox::before {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        right: 2px;
        height: 4px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 8px, #c8a55b 8px 14px, #5f9fc4 14px 20px, #c8a55b 20px 26px
        );
        opacity: 0.85;
      }
      #tb-portrait {
        flex: 0 0 auto;
        align-self: flex-start;
        margin-top: 6px;
        border: 2px solid var(--ink);
        border-radius: 2px;
        background: #d8c9a8;
        box-shadow: 2px 2px 0 rgba(43, 33, 24, 0.35);
      }
      #tb-portrait canvas {
        display: block;
        width: 60px;
        height: 60px;
        image-rendering: pixelated;
        box-shadow: none;
        border-radius: 0;
      }
      #tb-main { position: relative; flex: 1; min-width: 0; padding-top: 4px; }
      #tb-name[hidden], #tb-portrait[hidden] { display: none; }
      #tb-name {
        display: inline-block;
        margin-bottom: 3px;
        padding: 1px 9px;
        background: var(--ink);
        color: var(--paper);
        border-radius: 2px;
        font-size: 12.5px;
        letter-spacing: 0.08em;
      }
      #tb-text {
        font-size: 16.5px;
        min-height: 44px;
      }
      #tb-text.narrator { font-style: italic; color: #4c3d2e; }
      #tb-arrow {
        position: absolute;
        right: 2px;
        bottom: 0;
        font-size: 14px;
        animation: bob 0.9s ease-in-out infinite;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(3px); }
      }
      #tb-choices {
        display: flex;
        flex-direction: column;
        gap: 2px;
        margin-top: 4px;
      }
      .tb-choice {
        padding: 1px 8px 1px 20px;
        font-size: 15px;
        position: relative;
      }
      .tb-choice.sel {
        background: rgba(43, 33, 24, 0.09);
        border-radius: 2px;
      }
      .tb-choice.sel::before {
        content: '\25B8';
        position: absolute;
        left: 6px;
      }

      /* ---- journal overlay ---- */
      #journal {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.55);
      }
      .j-book {
        width: 82%;
        max-width: 620px;
        height: 78%;
        display: flex;
        flex-direction: column;
        background: linear-gradient(105deg, var(--paper) 49.7%, #d9c9a6 50%, var(--paper-dark) 50.3%);
        border: 2px solid var(--ink);
        border-radius: 4px;
        box-shadow: 4px 4px 0 rgba(43, 33, 24, 0.5), 0 0 60px rgba(0,0,0,0.5);
        color: var(--ink);
        padding: 14px 18px 10px;
        line-height: 1.45;
        animation: bookOpen 0.22s ease-out;
      }
      @keyframes bookOpen {
        from { transform: translateY(10px) scale(0.96); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .j-book, .letter-paper, .w-panel { animation: none !important; }
      }
      .j-head { display: flex; justify-content: space-between; align-items: baseline; }
      .j-name { font-size: 19px; letter-spacing: 0.04em; }
      .j-progress { font-size: 12.5px; font-style: italic; color: #6b5a44; }
      .j-tabs {
        display: flex;
        gap: 4px;
        margin: 8px 0 10px;
        border-bottom: 1px solid rgba(43, 33, 24, 0.35);
        padding-bottom: 6px;
      }
      .j-tab {
        padding: 2px 12px;
        font-size: 13.5px;
        letter-spacing: 0.06em;
        border: 1px solid transparent;
        border-radius: 2px;
        color: #7a6749;
      }
      .j-tab.on {
        background: var(--ink);
        color: var(--paper);
      }
      .j-body { display: flex; gap: 16px; flex: 1; min-height: 0; }
      .j-list { flex: 0 0 38%; overflow: hidden; font-size: 14.5px; }
      .j-item { padding: 2px 6px; color: #57452f; }
      .j-item.sel {
        background: rgba(43, 33, 24, 0.09);
        border-radius: 2px;
        color: var(--ink);
      }
      .j-locked { margin-top: 8px; font-size: 12.5px; font-style: italic; color: #a08c6b; }
      .j-detail { flex: 1; min-width: 0; border-left: 1px solid rgba(43,33,24,0.25); padding-left: 16px; overflow: hidden; }
      .j-title { font-size: 18px; }
      .j-sub { font-size: 13px; font-style: italic; color: #6b5a44; margin-bottom: 8px; }
      .j-nani, .j-you { font-size: 14px; margin-top: 8px; }
      .j-nani { color: #8a7455; font-style: italic; }
      .j-nani.empty { opacity: 0.55; }
      .j-nani span, .j-you span {
        display: block;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        opacity: 0.65;
        font-style: normal;
      }
      .j-empty { font-style: italic; color: #7a6749; margin-top: 20px; font-size: 14.5px; }
      .j-stitch { color: #c1512f; font-size: 12px; }
      .j-thread { font-size: 14px; margin-top: 10px; color: #7a5a3a; font-style: italic; }
      .j-thread span {
        display: block;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        opacity: 0.65;
        font-style: normal;
      }
      .j-thread-rule {
        height: 3px;
        margin: 10px 0 8px;
        border-radius: 2px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 10px, #d9a441 10px 20px, #3f7fb0 20px 30px, #6b8e4e 30px 40px
        );
        opacity: 0.75;
      }
      .j-thread-to { font-size: 12px; font-style: normal; color: #a3542f; margin-top: 6px; }
      .j-native { font-size: 15px; color: #7a5a3a; margin-left: 8px; font-weight: normal; }
      .j-dishart { margin: 2px 0 4px; }
      .j-dishart canvas { display: block; border-radius: 4px; }
      .j-route { flex: 1; overflow-y: auto; padding-right: 8px; }
      .j-route-stop { padding: 4px 2px; opacity: 0.55; }
      .j-route-stop.been { opacity: 0.85; }
      .j-route-stop.here { opacity: 1; }
      .j-route-head { display: flex; align-items: baseline; gap: 8px; }
      .j-route-glyph { width: 16px; text-align: center; color: #c1512f; }
      .j-route-name { font-size: 15.5px; }
      .j-route-stop.here .j-route-name { color: var(--ink); font-weight: 600; }
      .j-route-hop { font-size: 12px; font-style: italic; color: #8a7455; }
      .j-route-nani { font-size: 12.5px; font-style: italic; color: #8a7455; margin: 1px 0 2px 24px; }
      .j-route-nani.empty { opacity: 0.6; }
      .j-route-stitch {
        width: 2px; height: 8px; margin-left: 9px;
        background: repeating-linear-gradient(180deg, #b59a72 0 3px, transparent 3px 6px);
      }
      .j-tasks { flex: 1; overflow-y: auto; padding-right: 6px; }
      .j-task {
        font-size: 14px;
        line-height: 1.5;
        padding: 8px 10px 8px 26px;
        margin-bottom: 8px;
        position: relative;
        border-radius: 3px;
        color: #57452f;
      }
      .j-task::before {
        content: '\25E6';
        position: absolute;
        left: 8px;
        top: 7px;
        color: #a08c6b;
      }
      .j-task.now {
        background: rgba(193, 81, 47, 0.09);
        color: var(--ink);
      }
      .j-task.now::before { content: '\25B8'; color: #c1512f; }
      .j-hint { font-size: 11px; color: #8a7455; text-align: center; padding-top: 6px; }

      /* ---- title screen ---- */
      #title, #letter {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(19, 14, 10, 0.82);
      }
      /* The star plain, remembered: a slow drift of faint stars over the title. */
      #title::before {
        content: '';
        position: absolute;
        inset: -20% 0 0 0;
        pointer-events: none;
        background-image:
          radial-gradient(1.6px 1.6px at 12% 22%, rgba(242,230,208,0.8), transparent 60%),
          radial-gradient(1.2px 1.2px at 34% 64%, rgba(242,230,208,0.55), transparent 60%),
          radial-gradient(2px 2px at 56% 18%, rgba(232,220,196,0.7), transparent 60%),
          radial-gradient(1.2px 1.2px at 71% 47%, rgba(242,230,208,0.5), transparent 60%),
          radial-gradient(1.7px 1.7px at 88% 28%, rgba(242,230,208,0.75), transparent 60%),
          radial-gradient(1.2px 1.2px at 22% 82%, rgba(242,230,208,0.45), transparent 60%),
          radial-gradient(1.5px 1.5px at 64% 84%, rgba(242,230,208,0.6), transparent 60%),
          radial-gradient(1.2px 1.2px at 45% 38%, rgba(242,230,208,0.5), transparent 60%),
          radial-gradient(1.8px 1.8px at 79% 68%, rgba(242,230,208,0.65), transparent 60%);
        animation: starDrift 90s linear infinite, starBreathe 5s ease-in-out infinite;
      }
      @keyframes starDrift { from { transform: translateY(0); } to { transform: translateY(12%); } }
      @keyframes starBreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #title::before { animation: none; } }
      #title[hidden], #letter[hidden], #journal[hidden], #textbox[hidden] { display: none; }
      .t-card { text-align: center; color: #e8dcc4; padding: 0 24px; }
      .t-kicker {
        font-size: 13px;
        font-style: italic;
        color: #a08c6b;
        margin-bottom: 10px;
      }
      .t-name {
        font-size: clamp(34px, 6vw, 50px);
        line-height: 1.18;
        letter-spacing: 0.3em;
        margin-left: 0.3em; /* optically recenter the letterspacing */
        color: #f2e6d0;
        text-shadow: 0 3px 0 rgba(43, 33, 24, 0.9), 0 0 40px rgba(200, 165, 91, 0.25);
      }
      .t-rule {
        width: 210px;
        height: 5px;
        margin: 14px auto 12px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 10px, #c8a55b 10px 17px, #5f9fc4 17px 24px, #c8a55b 24px 31px
        );
        border-radius: 2px;
        opacity: 0.9;
      }
      .t-sub { font-size: 14px; font-style: italic; color: #b8a684; max-width: 380px; margin: 0 auto 26px; }
      .t-menu { display: flex; flex-direction: column; gap: 7px; margin-bottom: 30px; }
      .t-opt { font-size: 17px; color: #9c8a6b; }
      .t-opt.sel { color: #f2e6d0; }
      .t-controls {
        display: flex;
        gap: 22px;
        justify-content: center;
        font-size: 12px;
        color: #8a7455;
      }
      .t-controls b { color: #c8a55b; font-weight: normal; }

      /* ---- Nani's letter ---- */
      .letter-paper {
        width: 78%;
        max-width: 470px;
        background: linear-gradient(#f4ead6, #e9dabb);
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: 4px 4px 0 rgba(43, 33, 24, 0.5), 0 0 70px rgba(0, 0, 0, 0.55);
        padding: 26px 32px 14px;
        color: #3d3022;
        animation: letterOpen 0.4s ease-out;
      }
      @keyframes letterOpen {
        from { transform: translateY(16px) rotate(-0.6deg) scale(0.97); opacity: 0; }
        to { transform: none; opacity: 1; }
      }
      .letter-body { font-style: italic; font-size: 15.5px; line-height: 1.55; }
      .letter-body p { margin: 0 0 12px; }
      .letter-body b { letter-spacing: 0.04em; }
      .letter-sign { text-align: right; margin-top: 16px; }
      .letter-hint {
        text-align: center;
        font-size: 11.5px;
        color: #a08c6b;
        padding-top: 6px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

      /* ---- weaving mini-game ---- */
      #weave {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.55);
      }
      #weave[hidden] { display: none; }
      .w-panel {
        width: 62%;
        max-width: 430px;
        background: linear-gradient(#f4ead6, #e9dabb);
        border: 2px solid var(--ink);
        border-radius: 3px;
        box-shadow: 4px 4px 0 rgba(43, 33, 24, 0.5);
        padding: 14px 20px 12px;
        color: var(--ink);
        text-align: center;
        animation: bookOpen 0.2s ease-out;
      }
      .w-title { font-size: 17px; letter-spacing: 0.12em; margin-bottom: 8px; }
      .w-cloth {
        min-height: 40px;
        display: flex;
        flex-direction: column;
        gap: 3px;
        align-items: center;
        justify-content: center;
        padding: 6px 0 10px;
      }
      .w-row { display: flex; gap: 2px; }
      .w-row span { width: 22px; height: 9px; border-radius: 1px; display: inline-block; }
      .w-empty { font-size: 12px; font-style: italic; color: #a08c6b; }
      .w-seq { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
      .w-cell {
        width: 30px;
        height: 30px;
        border: 2px solid var(--ink);
        border-radius: 3px;
        transition: transform 0.12s ease;
      }
      .w-cell.on { transform: scale(1.12); }
      .w-hint { font-size: 13.5px; font-style: italic; min-height: 20px; margin-bottom: 10px; }
      .w-legend { display: flex; gap: 14px; justify-content: center; }
      .w-key { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; }
      .w-key i { width: 14px; height: 14px; border: 1px solid var(--ink); border-radius: 2px; display: inline-block; }

      /* ---- chapter mini-games (roots created by the engine) ---- */
      .mg-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(23, 18, 14, 0.55);
      }
      .mg-overlay[hidden] { display: none; }
      .c-track {
        position: relative;
        height: 44px;
        margin: 6px 4px 8px;
        border: 2px solid var(--ink);
        border-radius: 22px;
        background: linear-gradient(#7fb3c4, #4e8fa6);
        overflow: hidden;
      }
      .c-zone {
        position: absolute;
        left: 4%;
        width: 20%;
        top: 0;
        bottom: 0;
        background: rgba(242, 230, 208, 0.28);
        border-right: 2px dashed rgba(242, 230, 208, 0.7);
      }
      .c-zone.wide { left: 30%; width: 40%; border-left: 2px dashed rgba(242,230,208,0.7); }
      .c-horse, .c-rider {
        position: absolute;
        top: 50%;
        width: 20px;
        height: 20px;
        border-radius: 50% 50% 40% 40%;
        background: #d0b276;
        border: 2px solid var(--ink);
        transform: translate(-50%, -50%);
      }
      .c-horse { left: 12%; }
      .c-wave {
        position: absolute;
        top: -4px;
        bottom: -4px;
        width: 16px;
        border-radius: 8px;
        background: linear-gradient(#f2fbff, #8fcbe8);
        border: 2px solid rgba(43, 33, 24, 0.55);
      }
      .c-count { font-size: 13px; letter-spacing: 0.3em; margin-bottom: 6px; color: #57452f; }
      .n-grid { display: grid; gap: 3px; margin: 8px 2px 10px; }
      .n-cell {
        aspect-ratio: 1;
        border: 1.6px solid rgba(60, 110, 110, 0.8);
        border-radius: 2px;
        background: rgba(60, 110, 110, 0.12);
      }
      .n-cell.hole { background: rgba(23, 18, 14, 0.5); border-style: dashed; }
      .n-cell.cur { outline: 3px solid #c1512f; outline-offset: -1px; }

      /* ---- door-transition fade ---- */
      #fade {
        position: absolute;
        inset: 0;
        background: #17120e;
        opacity: 0;
        pointer-events: none;
      }

      /* ---- the iris wipe: a hole in the dark, closing and opening ---- */
      #iris {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 0;
        height: 0;
        border-radius: 50%;
        pointer-events: none;
        display: none;
      }

      /* ---- the journey card: a held breath between regions ---- */
      #journeycard {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.55s ease;
        color: #e8dcc4;
      }
      #journeycard.show { opacity: 1; }
      .jc-name {
        font-size: clamp(26px, 4.4vw, 44px);
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .jc-rule {
        width: 120px;
        height: 3px;
        margin: 14px auto 12px;
        border-radius: 2px;
        background: repeating-linear-gradient(
          90deg,
          #c1512f 0 12px, #d9a441 12px 24px, #3f7fb0 24px 36px, #6b8e4e 36px 48px
        );
        opacity: 0.85;
      }
      .jc-hop { font-size: 15px; font-style: italic; color: #a8987c; }

      /* ---- debug ---- */
      #debug {
        position: fixed;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 9px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 11px;
        line-height: 1.5;
        color: #c8a55b;
        background: #17120ecc;
        border: 1px solid #2b2118;
        white-space: pre;
        pointer-events: none;
        display: none;
      }
      #debug[data-on='1'] { display: block; }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="frame">
        <canvas id="game"></canvas>
        <div id="hud">
          <div id="plate"></div>
          <div id="toasts"></div>
          <div id="errand" hidden></div>
          <div id="textbox" hidden>
            <div id="tb-portrait"></div>
            <div id="tb-main">
              <div id="tb-name"></div>
              <div id="tb-text"></div>
              <div id="tb-arrow">&#9662;</div>
              <div id="tb-choices"></div>
            </div>
          </div>
          <div id="journal" hidden></div>
          <div id="weave" hidden></div>
          <div id="fade"></div>
          <div id="iris"></div>
          <div id="journeycard"></div>
          <div id="letter" hidden></div>
          <div id="title" hidden></div>
        </div>
      </div>
    </div>
